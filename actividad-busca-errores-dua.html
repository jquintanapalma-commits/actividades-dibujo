      s = el('i', 'bx-p');
      s.style.left = (c.x - r.left) + 'px'; s.style.top = (c.y - r.top) + 'px';
      s.style.background = cols[i % cols.length];
      s.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px');
      s.style.setProperty('--dy', Math.round(Math.sin(a) * d) + 'px');
      sheet.appendChild(s);
      (function (n) { setTimeout(function () { if (n.parentNode) { n.parentNode.removeChild(n); } }, 760); })(s);
    }
  }

  /* ====== INSPECCIONAR UN ELEMENTO ====== */
  function falseAlarm(e) {
    e.seen = true; S.seen++; S.falses++; S.streak = 0;
    S.xp = Math.max(0, S.xp - 15);
    addSeen(e);
    hud(); renderCase(0); bump('#bx-c-xp');
    say('bad', 'Error: ese elemento es correcto', okText(e) + ' (\u221215 puntos)');
    sfx('bad');
  }
  function foundError(e) {
    var n, gain, g;
    e.found = true; S.found.push(e.id); n = S.found.length;
    S.streak++; S.best = Math.max(S.best, S.streak);
    gain = 100 + 10 * (S.streak - 1);
    S.xp += gain;
    g = document.getElementById('bx-e-' + e.id);
    if (g) { g.setAttribute('class', 'bx-el bx-fixed'); }
    addMark(e, n);
    if (S.hintErr === e.id) { S.hintErr = null; }
    clearHintLayer();
    hud(); renderCase(n); bump('#bx-c-xp'); bump('#bx-c-st'); bump('#bx-c-ct');
    say('ok', '\u00a1Anomal\u00eda ' + n + ' de ' + NERR + ' localizada!', e.err.fb + '. (+' + gain + ' puntos' + (S.streak > 1 ? ', racha \u00d7' + S.streak : '') + ')');
    sfx('ok');
    burstAt(e.err.m[0], e.err.m[1]);
    if (n >= NERR) { closeCase(); }
  }
  function inspect(e) {
    if (!e) { return; }
    setHL(e);
    root.classList.add('bx-played');
    if (S.done) {
      say('ok', e.err ? 'Anomal\u00eda ya corregida' : 'Elemento correcto', e.err ? e.err.fb + '.' : okText(e));
      return;
    }
    if (!S.on) { return; }
    if (e.err) {
      if (e.found) { say('ok', 'Esa anomal\u00eda ya est\u00e1 en el expediente', e.err.fb + '.'); return; }
      foundError(e);
    } else if (e.seen) {
      say('', 'Ya lo hab\u00edas descartado', 'Ese elemento ya lo has inspeccionado: es correcto y no hace falta revisarlo otra vez.');
    } else {
      falseAlarm(e);
    }
  }
  function inspectAt(p, ptype) {
    var tol = tolFor(ptype), e = pickAt(p.x, p.y, tol, hpenNow());
    if (!e) {
      setHL(null);
      say('', 'Sin indicios en ese punto', 'No hay ning\u00fan elemento del plano ah\u00ed. Ac\u00e9rcate a una l\u00ednea, una cota, una cifra o un s\u00edmbolo.');
      return;
    }
    inspect(e);
    if (ptype === 'touch' || ptype === 'pen') { setTimeout(function () { if (hlE === e) { setHL(null); } }, 900); }
  }
  function hpenNow() { return 8 / scaleNow(); }
  function tolFor(ptype) { return ((ptype === 'touch' || ptype === 'pen') ? 20 : 10) / scaleNow(); }

  /* ====== PISTA DE WALTER PORSTMANN ====== */
  function hint() {
    if (!S.on && !S.done) { return; }
    if (S.done) { say('ok', 'Caso cerrado', 'Ya has localizado las ocho anomal\u00edas.'); return; }
    var left = [], i, e, lv, m;
    for (i = 0; i < PLAN.length; i++) { if (PLAN[i].err && !PLAN[i].found) { left.push(PLAN[i]); } }
    if (!left.length) { return; }
    e = (S.hintErr && !BYID[S.hintErr].found) ? BYID[S.hintErr] : pick(left);
    S.hintErr = e.id;
    lv = Math.min(2, (S.hintLv[e.id] || 0) + 1); S.hintLv[e.id] = lv;
    S.hints++; S.xp = Math.max(0, S.xp - 30);
    hud(); renderCase(0); bump('#bx-c-xp');
    clearHintLayer();
    if (lv === 1) {
      var z = ZONES[e.err.view];
      gHint.innerHTML = '<rect class="bx-hz" x="' + (z[0] - 4) + '" y="' + (z[1] - 4) + '" width="' + (z[2] - z[0] + 8) + '" height="' + (z[3] - z[1] + 8) + '" rx="6"/>';
      zoomZone(e.err.view);
      m = 'Todav\u00eda queda una anomal\u00eda en ' + VIEWN[e.err.view] + '. Repasa con calma sus l\u00edneas, sus cotas y sus s\u00edmbolos. (\u221230 puntos)';
    } else {
      gHint.innerHTML = '<circle class="bx-hz" cx="' + e.err.m[0] + '" cy="' + e.err.m[1] + '" r="46"/>';
      m = 'Mira bien la zona marcada: hay algo que no cumple las normas de acotaci\u00f3n o de l\u00edneas normalizadas. (\u221230 puntos)';
    }
    hintTimer = setTimeout(clearHintLayer, 14000);
    say('hint', 'Pista de Walter Porstmann', m);
    sfx('tick');
  }

  /* ====== FINAL ====== */
  function starsSvg(n) {
    var h = '';
    for (var i = 0; i < 3; i++) {
      h += '<svg viewBox="0 0 24 24" class="' + (i < n ? 'bx-on' : '') + '" aria-hidden="true" focusable="false">' + ICON.star + '</svg>';
    }
    return h;
  }
  function closeCase() {
    S.done = true; S.on = false;
    var st = $('#bx-stamp');
    if (st) { st.classList.add('bx-show'); }
    setTimeout(function () { if (S.done) { win(); } }, reduced ? 500 : 1900);
  }
  function win() {
    var pen = S.falses + S.hints;
    var stars = pen <= 3 ? 3 : (pen <= 8 ? 2 : 1);
    var sub = stars === 3 ? '\u00a1Ojo de maestro! Has localizado las ocho anomal\u00edas con muy pocos errores y el plano ya puede fabricarse.'
            : (stars === 2 ? '\u00a1Muy buen trabajo, aspirante! Has cerrado el caso; con un poco menos de falsas alarmas lograr\u00e1s la m\u00e1xima valoraci\u00f3n.'
                           : '\u00a1Caso cerrado! Repite la prueba para afinar tu ojo ante el Consejo de Maestros.');
    W('#bx-wsub').textContent = sub;
    var sEl = W('#bx-stars');
    sEl.innerHTML = starsSvg(stars);
    sEl.setAttribute('aria-label', 'Valoraci\u00f3n: ' + stars + ' de 3 estrellas');
    W('#bx-wstats').innerHTML =
      '<span class="bx-chip">Puntos <b>' + S.xp + '</b></span>' +
      '<span class="bx-chip">Falsas alarmas <b>' + S.falses + '</b></span>' +
      '<span class="bx-chip">Pistas de Porstmann <b>' + S.hints + '</b></span>' +
      '<span class="bx-chip">Mejor racha <b>\u00d7' + S.best + '</b></span>';
    var w = winEl;
    w.removeAttribute('hidden');
    sfx('win');
    if (!reduced) {
      var cols = ['#e2231a', '#ffc700', '#1c4fa3', '#121212', '#fffdf5'];
      for (var i = 0; i < 48; i++) {
        var c = el('i', 'bx-cf');
        c.style.left = (Math.random() * 100) + '%';
        c.style.background = cols[i % cols.length];
        c.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
        c.style.animationDelay = (Math.random() * 0.8) + 's';
        w.appendChild(c);
      }
      setTimeout(function () {
        Array.prototype.slice.call(winEl.querySelectorAll('.bx-cf')).forEach(function (n) { if (n.parentNode) { n.parentNode.removeChild(n); } });
      }, 5200);
    }
    var b = w.querySelector('[data-act="again"]');
    if (b) { try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); } }
    say('ok', '\u00a1Tercera prueba superada!', 'Puedes revisar el plano corregido o pulsar \u00abReiniciar\u00bb para repetir la prueba.');
  }

  /* ====== FLUJO ====== */
  function bindPlan() {
    svg = $('#bx-svg'); sheet = $('#bx-sheet');
    gHL = $('#bx-hl'); gSeen = $('#bx-seen'); gHint = $('#bx-hint'); gMarks = $('#bx-marks'); gRet = $('#bx-ret');
  }
  function startGame() {
    newState();
    S.on = true;
    clearHintLayer();
    root.classList.remove('bx-played');
    $('#bx-cover').setAttribute('hidden', '');
    $('#bx-game').removeAttribute('hidden');
    winEl.setAttribute('hidden', '');
    var old = $('#bx-svg');
    old.outerHTML = planSVG();
    bindPlan();
    hlE = null; curZone = 'todo'; kb = { x: 500, y: 364 };
    sheet.classList.remove('bx-kb', 'bx-zoomed');
    var st = $('#bx-stamp'); if (st) { st.classList.remove('bx-show'); }
    VB = { x: 0, y: 0, w: PW, h: PH };
    onView();
    hud(); renderCase(0);
    say('', 'Expediente abierto', 'Alguien ha modificado este plano. Inspecciona sus l\u00edneas, cotas y s\u00edmbolos: pulsa sobre lo que te parezca sospechoso. Si dudas, pide una pista a Walter Porstmann.');
    var sc = $('#bx-scan');
    if (sc && !reduced) { sc.classList.remove('bx-go'); void sc.offsetWidth; sc.classList.add('bx-go'); }
    try { root.scrollIntoView({ block: 'start', behavior: 'auto' }); } catch (e) { }
  }
  function restartGame() {
    winEl.setAttribute('hidden', '');
    startGame();
  }
  function setSound() {
    soundOn = !soundOn;
    var b = $('#bx-snd');
    b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    b.innerHTML = ic(soundOn ? 'sound' : 'mute') + '<span>Sonido: ' + (soundOn ? 's\u00ed' : 'no') + '</span>';
    if (soundOn) { sfx('ok'); }
  }
  function act(name, src) {
    if (name === 'start') { startGame(); }
    else if (name === 'hint') { hint(); }
    else if (name === 'sound') { setSound(); }
    else if (name === 'restart' || name === 'again') { restartGame(); }
    else if (name === 'zone') { zoomZone(src.getAttribute('data-z')); }
    else if (name === 'zin') { zoomBy(1.5, VB.x + VB.w / 2, VB.y + VB.h / 2); }
    else if (name === 'zout') { zoomBy(1 / 1.5, VB.x + VB.w / 2, VB.y + VB.h / 2); }
    else if (name === 'review') {
      winEl.setAttribute('hidden', '');
      try { sheet.scrollIntoView({ block: 'nearest', behavior: 'auto' }); } catch (e) { }
    }
  }

  /* ====== PUNTERO, RATON Y TACTIL ====== */
  var PT = { ptrs: {}, n: 0, drag: null, pinch: null };
  function ptCount() { var k, n = 0; for (k in PT.ptrs) { if (PT.ptrs.hasOwnProperty(k)) { n++; } } return n; }
  function hoverAt(ev) {
    if (!svg || (!S.on && !S.done) || ev.pointerType !== 'mouse') { return; }
    var p = toImg(ev.clientX, ev.clientY), e = pickAt(p.x, p.y, tolFor('mouse'), hpenNow());
    setHL(e);
    placeRet(p.x, p.y);
  }
  function bindPointer() {
    var sh = $('#bx-sheet');
    sh.addEventListener('pointerdown', function (ev) {
      if (!svg || (!S.on && !S.done)) { return; }
      if (ev.pointerType === 'mouse' && ev.button !== 0) { return; }
      sheet.classList.remove('bx-kb');
      if (ev.isPrimary) { PT.ptrs = {}; PT.pinch = null; PT.drag = null; }
      PT.ptrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY, type: ev.pointerType };
      var n = ptCount();
      if (n === 1) { PT.drag = { id: ev.pointerId, vb: cp(VB), moved: false }; PT.pinch = null; }
      else if (n === 2) {
        var ids = [], k;
        for (k in PT.ptrs) { if (PT.ptrs.hasOwnProperty(k)) { ids.push(k); } }
        var a = PT.ptrs[ids[0]], b = PT.ptrs[ids[1]];
        PT.drag = null;
        PT.pinch = { ids: ids, d: Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)) };
      }
      try { sh.setPointerCapture(ev.pointerId); } catch (e) { }
    });
    sh.addEventListener('pointermove', function (ev) {
      if (!svg) { return; }
      var q = PT.ptrs[ev.pointerId];
      if (!q) { hoverAt(ev); return; }
      q.x = ev.clientX; q.y = ev.clientY;
      if (PT.pinch) {
        var a = PT.ptrs[PT.pinch.ids[0]], b = PT.ptrs[PT.pinch.ids[1]];
        if (!a || !b) { return; }
        var d = Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
        if (PT.pinch.d > 8 && d > 8) {
          var mid = toImg((a.x + b.x) / 2, (a.y + b.y) / 2);
          zoomBy(d / PT.pinch.d, mid.x, mid.y, true);
          PT.pinch.d = d;
        }
        return;
      }
      if (PT.drag && PT.drag.id === ev.pointerId) {
        var dx = ev.clientX - q.sx, dy = ev.clientY - q.sy;
        if (!PT.drag.moved && Math.sqrt(dx * dx + dy * dy) > (q.type === 'mouse' ? 6 : 10)) { PT.drag.moved = true; }
        if (PT.drag.moved && zoomK > 1.02) {
          var s = scaleNow(), v = PT.drag.vb;
          curZone = 'x';
          setVB(clampVB({ x: v.x - dx / s, y: v.y - dy / s, w: v.w, h: v.h }));
          sheet.classList.add('bx-pan');
        } else if (q.type === 'mouse') { hoverAt(ev); }
      }
    });
    function endPtr(ev, cancel) {
      var q = PT.ptrs[ev.pointerId];
      if (!q) { return; }
      delete PT.ptrs[ev.pointerId];
      sheet.classList.remove('bx-pan');
      if (PT.pinch) { if (ptCount() < 2) { PT.pinch = null; PT.drag = null; } return; }
      if (PT.drag && PT.drag.id === ev.pointerId) {
        var tap = !PT.drag.moved && !cancel;
        PT.drag = null;
        if (tap && svg) { inspectAt(toImg(ev.clientX, ev.clientY), q.type); }
      }
    }
    sh.addEventListener('pointerup', function (ev) { endPtr(ev, false); });
    sh.addEventListener('pointercancel', function (ev) { endPtr(ev, true); });
    sh.addEventListener('pointerleave', function (ev) {
      if (ev.pointerType === 'mouse' && !PT.ptrs[ev.pointerId]) { setHL(null); if (!kbOn()) { hideRet(); } }
    });
    sh.addEventListener('wheel', function (ev) {
      if (!svg || !(ev.ctrlKey || ev.metaKey) || (!S.on && !S.done)) { return; }
      ev.preventDefault();
      var p = toImg(ev.clientX, ev.clientY);
      zoomBy(ev.deltaY < 0 ? 1.25 : 1 / 1.25, p.x, p.y, true);
    }, { passive: false });
    sh.addEventListener('contextmenu', function (ev) { if (ev.pointerType === 'touch') { ev.preventDefault(); } });
    sh.addEventListener('blur', function () { sheet.classList.remove('bx-kb'); hideRet(); setHL(null); });
    sh.addEventListener('keydown', function (ev) {
      if (!svg || (!S.on && !S.done)) { return; }
      var k = ev.key, step = ev.shiftKey ? 48 : 12, ok = true, e;
      if (k === 'ArrowLeft') { kb.x -= step; }
      else if (k === 'ArrowRight') { kb.x += step; }
      else if (k === 'ArrowUp') { kb.y -= step; }
      else if (k === 'ArrowDown') { kb.y += step; }
      else if (k === 'Enter' || k === ' ') {
        e = pickAt(kb.x, kb.y, 26 / scaleNow(), hpenNow());
        if (e) { inspect(e); } else { say('', 'Sin indicios en ese punto', 'Mueve la lupa hasta una l\u00ednea, una cota, una cifra o un s\u00edmbolo.'); }
        sheet.classList.add('bx-kb'); placeRet(kb.x, kb.y);
        ev.preventDefault();
        return;
      }
      else if (k === '+' || k === '=') { zoomBy(1.4, kb.x, kb.y); }
      else if (k === '-' || k === '_') { zoomBy(1 / 1.4, kb.x, kb.y); }
      else if (k === '0') { zoomZone('todo'); }
      else { ok = false; }
      if (!ok) { return; }
      ev.preventDefault();
      kb.x = clamp(kb.x, 0, PW); kb.y = clamp(kb.y, 0, PH);
      sheet.classList.add('bx-kb');
      if (k.indexOf('Arrow') === 0) {
        if (kb.x < VB.x + 20 || kb.x > VB.x + VB.w - 20 || kb.y < VB.y + 20 || kb.y > VB.y + VB.h - 20) {
          setVB(clampVB({ x: kb.x - VB.w / 2, y: kb.y - VB.h / 2, w: VB.w, h: VB.h }));
        }
        e = pickAt(kb.x, kb.y, 26 / scaleNow(), hpenNow());
        setHL(e);
        var s = $('#bx-sr'); if (s) { s.textContent = e ? e.nm : 'Sin elementos cerca'; }
      }
      placeRet(kb.x, kb.y);
    });
  }

  /* ====== ADAPTACION AL ANCHO DEL CONTENEDOR ====== */
  var wTimer = 0;
  function setW() {
    var w = root.getBoundingClientRect().width || root.offsetWidth || 800;
    var c = w >= 860 ? 'bx-w-l' : (w >= 560 ? 'bx-w-m' : 'bx-w-s');
    if (!root.classList.contains(c)) {
      root.classList.remove('bx-w-l', 'bx-w-m', 'bx-w-s');
      root.classList.add(c);
    }
    if (svg && svg.getScreenCTM) { try { onView(); } catch (e) { } }
  }
  function queueW() {
    if (wTimer) { return; }
    wTimer = window.requestAnimationFrame(function () { wTimer = 0; setW(); });
  }

  /* ====== ARRANQUE ====== */
  root.classList.add('bx-app');
  root.setAttribute('lang', 'es');
  root.innerHTML = coverHTML() + gameHTML();
  winEl.innerHTML = winHTML();
  document.body.appendChild(winEl);
  bindPlan();
  bindPointer();
  root.addEventListener('click', function (e) {
    var tg = e.target, b = tg.closest ? tg.closest('[data-act]') : null;
    if (b && root.contains(b)) { act(b.getAttribute('data-act'), b); }
  });
  winEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b) { act(b.getAttribute('data-act'), b); }
  });
  winEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { act('review'); return; }
    if (e.key === 'Tab') {
      var btns = Array.prototype.slice.call(winEl.querySelectorAll('button'));
      if (!btns.length) { return; }
      var first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  setW();
  if (window.ResizeObserver) { try { new ResizeObserver(queueW).observe(root); } catch (e) { } }
  window.addEventListener('resize', queueW);
  window.addEventListener('load', queueW);
})();
</script>

<style>
/* Solo tiene efecto dentro de un iframe: las variables las rellena el script de abajo.
   Sin ellas (página abierta directamente) los valores son 0 y todo queda como en el original. */
.vx-win,.dx-win,.bx-win,.qx-win,.dx-zoom{border-top:var(--rd-vt,0px) solid transparent;border-bottom:var(--rd-fb,0px) solid transparent}
.vx-pool.vx-docked{margin-bottom:var(--rd-fb,0px)!important}
</style>
<script>
/* Dentro de un iframe más alto que la ventana, "fixed" se refiere a todo el marco y no a lo que se ve.
   Este ajuste averigua qué parte del marco está a la vista (columna de centinelas con IntersectionObserver)
   para centrar ahí las ventanas y colocar la bandeja flotante. Fuera de un iframe no hace nada. */
(function () {
  var enMarco = false;
  try { enMarco = window.self !== window.top; } catch (e) { enMarco = true; }
  if (!enMarco || !window.IntersectionObserver) { return; }
  var PASO = 20, caja = null, io = null, estado = {}, ultimo = "", raiz = document.documentElement;
  function resumir() {
    var alto = window.innerHeight, t = null, b = null, k, i, vt, vb, clave;
    for (k in estado) {
      if (estado[k]) { i = +k; if (t === null || i < t) { t = i; } if (b === null || i > b) { b = i; } }
    }
    if (t === null) { return; }
    /* se redondea hacia dentro: es preferible usar un poco menos de la zona visible que salirse de ella */
    vt = (t === 0) ? 0 : (t + 1) * PASO;
    vb = (b >= Math.ceil(alto / PASO) - 1) ? alto : b * PASO;
    if (vb <= vt) { return; }
    clave = vt + ":" + vb + ":" + alto;
    if (clave === ultimo) { return; }
    ultimo = clave;
    window.__rdVt = vt;
    raiz.style.setProperty("--rd-vt", vt + "px");
    raiz.style.setProperty("--rd-fb", Math.max(0, alto - vb) + "px");
    try { document.dispatchEvent(new Event("scroll")); } catch (e) {}
  }
  function montar() {
    var alto = window.innerHeight, n = Math.ceil(alto / PASO), i, s;
    if (io) { io.disconnect(); }
    if (caja && caja.parentNode) { caja.parentNode.removeChild(caja); }
    estado = {};
    ultimo = "";
    caja = document.createElement("div");
    caja.setAttribute("aria-hidden", "true");
    caja.style.cssText = "position:fixed;left:0;top:0;width:1px;height:100vh;pointer-events:none;visibility:hidden";
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { estado[e.target.getAttribute("data-i")] = e.isIntersecting; });
      resumir();
    });
    for (i = 0; i < n; i++) {
      s = document.createElement("div");
      s.setAttribute("data-i", i);
      s.style.cssText = "position:absolute;left:0;top:" + (i * PASO) + "px;width:1px;height:" + PASO + "px";
      caja.appendChild(s);
      io.observe(s);
    }
    document.body.appendChild(caja);
  }
  montar();
  window.addEventListener("resize", montar);
})();
</script>
<script>
/* Si esta página va dentro de un iframe, avisa a la página que la contiene de la altura que necesita
   (solo tiene efecto si esa página tiene un receptor; si no, no hace nada). */
(function () {
  if (window.parent === window) { return; }
  var ultimo = -1;
  function enviar() {
    var h = document.body.offsetHeight;
    if (h && h !== ultimo) {
      ultimo = h;
      try { window.parent.postMessage({ tipo: "rd-alto", alto: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("load", enviar);
  window.addEventListener("resize", enviar);
  if (window.ResizeObserver) { new window.ResizeObserver(enviar).observe(document.body); }
  else { window.setInterval(enviar, 500); }
})();
</script>
