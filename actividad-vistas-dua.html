  }
  function restartGame() {
    winEl.setAttribute('hidden', '');
    startGame();
  }
  function setSound() {
    soundOn = !soundOn;
    var b = $('#vx-snd');
    b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    b.innerHTML = ic(soundOn ? 'sound' : 'mute') + '<span>Sonido: ' + (soundOn ? 's\u00ed' : 'no') + '</span>';
    if (soundOn) { sfx('ok'); }
  }
  function act(name) {
    if (name === 'start') { startGame(); }
    else if (name === 'hint') { hint(); }
    else if (name === 'sound') { setSound(); }
    else if (name === 'restart' || name === 'again') { restartGame(); }
    else if (name === 'review') {
      winEl.setAttribute('hidden', '');
      try { root.scrollIntoView({ block: 'start', behavior: 'auto' }); } catch (e) { }
    }
  }

  /* ====== ARRASTRAR (rat\u00f3n, t\u00e1ctil y l\u00e1piz) ====== */
  var drag = null, scrollRAF = 0, lastX = 0, lastY = 0;

  function slotAt(x, y) {
    var best = null, bd = 1e9, list = $$('.vx-slot');
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (s.classList.contains('vx-full')) { continue; }
      var r = s.getBoundingClientRect(), m = 10;
      if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m) {
        var dx = x - (r.left + r.right) / 2, dy = y - (r.top + r.bottom) / 2, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = s; }
      }
    }
    return best;
  }
  function clearOver() {
    $$('.vx-slot.vx-over').forEach(function (s) { s.classList.remove('vx-over'); });
  }
  function overAt(x, y) {
    var s = slotAt(x, y);
    clearOver();
    if (s) { s.classList.add('vx-over'); }
    return s;
  }
  function moveGhost(x, y) {
    var g = drag.ghost;
    g.style.transform = 'translate(' + Math.round(x - drag.ox) + 'px,' + Math.round(y - drag.oy) + 'px) scale(1.07) rotate(-3deg)';
  }
  function beginDrag(x, y) {
    var t = drag.tile, r = t.getBoundingClientRect();
    var g = t.cloneNode(true);
    g.className = 'vx-tile vx-ghost';
    g.removeAttribute('tabindex'); g.removeAttribute('role'); g.removeAttribute('aria-label'); g.removeAttribute('aria-pressed');
    g.style.width = r.width + 'px';
    g.style.height = r.height + 'px';
    drag.ox = drag.sx - r.left;
    drag.oy = drag.sy - r.top;
    drag.ghost = g;
    drag.on = true;
    document.body.appendChild(g);
    t.classList.add('vx-lifted');
    moveGhost(x, y);
  }
  /* Zona inferior de autodesplazamiento: con la bandeja fija abajo, es la franja justo encima de ella */
  function bottomZone() {
    if (dockShown) {
      var r = $('#vx-poolbox').getBoundingClientRect();
      return { from: r.top - 56, to: r.top - 2 };
    }
    return { from: window.innerHeight - 70, to: window.innerHeight + 5000 };
  }
  function scrollStep() {
    scrollRAF = 0;
    if (!drag || !drag.on) { return; }
    var z = bottomZone(), sp = 0;
    if (lastY < 70) { sp = -Math.ceil((70 - lastY) / 3); }
    else if (lastY > z.from && lastY < z.to) { sp = Math.ceil((lastY - z.from) / 3); }
    if (sp) {
      window.scrollBy(0, sp);
      moveGhost(lastX, lastY);
      overAt(lastX, lastY);
      scrollRAF = window.requestAnimationFrame(scrollStep);
    }
  }
  function endDragCleanup() {
    if (scrollRAF) { window.cancelAnimationFrame(scrollRAF); scrollRAF = 0; }
    clearOver();
  }

  root.addEventListener('pointerdown', function (e) {
    if (!S.on) { return; }
    if (e.pointerType === 'mouse' && e.button !== 0) { return; }
    var t = e.target.closest ? e.target.closest('.vx-tile') : null;
    if (!t || !root.contains(t) || t.classList.contains('vx-locked') || t._busy || drag) { return; }
    if (!t.closest('.vx-cell')) { return; }
    drag = { tile: t, id: e.pointerId, sx: e.clientX, sy: e.clientY, on: false, ghost: null, ox: 0, oy: 0 };
    try { t.setPointerCapture(e.pointerId); } catch (err) { }
    if (e.pointerType === 'mouse') { e.preventDefault(); }
    try { t.focus({ preventScroll: true }); } catch (err2) { }
  });
  root.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) { return; }
    var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.on) {
      if (Math.abs(dx) + Math.abs(dy) < 8) { return; }
      beginDrag(e.clientX, e.clientY);
    }
    lastX = e.clientX; lastY = e.clientY;
    moveGhost(lastX, lastY);
    overAt(lastX, lastY);
    var zz = bottomZone();
    if (!scrollRAF && (lastY < 70 || (lastY > zz.from && lastY < zz.to))) { scrollRAF = window.requestAnimationFrame(scrollStep); }
    e.preventDefault();
  });
  function finish(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) { return; }
    var d = drag;
    drag = null;
    endDragCleanup();
    try { d.tile.releasePointerCapture(e.pointerId); } catch (err) { }
    if (!d.on) {
      if (!cancelled) { toggleSel(d.tile); }
      return;
    }
    d.tile._busy = true;
    var slot = cancelled ? null : slotAt(e.clientX, e.clientY);
    if (!slot) {
      flyTo(d.ghost, d.tile.getBoundingClientRect(), function () { d.tile.classList.remove('vx-lifted'); d.tile._busy = false; });
      return;
    }
    tryPlace(d.tile, slot, d.ghost);
  }
  root.addEventListener('pointerup', function (e) { finish(e, false); });
  root.addEventListener('pointercancel', function (e) { finish(e, true); });
  root.addEventListener('contextmenu', function (e) { if (drag && drag.on) { e.preventDefault(); } });

  /* ====== CLIC Y TECLADO ====== */
  root.addEventListener('click', function (e) {
    var tg = e.target;
    var b = tg.closest ? tg.closest('[data-act]') : null;
    if (b && root.contains(b)) { act(b.getAttribute('data-act')); return; }
    var s = tg.closest ? tg.closest('.vx-slot') : null;
    if (s && root.contains(s)) { slotActivate(s); }
  });
  root.addEventListener('keydown', function (e) {
    var key = e.key;
    var tg = e.target;
    if (key === 'Escape' && S.sel) { clearSel(); say('', 'Selecci\u00f3n cancelada.'); return; }
    if (key !== 'Enter' && key !== ' ' && key !== 'Spacebar') { return; }
    if (tg.classList && tg.classList.contains('vx-tile') && tg.closest('.vx-cell')) {
      e.preventDefault(); toggleSel(tg);
    } else if (tg.classList && tg.classList.contains('vx-slot')) {
      e.preventDefault(); slotActivate(tg);
    }
  });

  /* ====== ADAPTACI\u00d3N AL ANCHO DEL CONTENEDOR ====== */
  var wTimer = 0;
  function setW() {
    var w = root.getBoundingClientRect().width || root.offsetWidth || 800;
    var c = w >= 820 ? 'vx-w-l' : (w >= 560 ? 'vx-w-m' : 'vx-w-s');
    if (!root.classList.contains(c)) {
      root.classList.remove('vx-w-l', 'vx-w-m', 'vx-w-s');
      root.classList.add(c);
    }
    queueF();
  }

  /* ====== LAS PRUEBAS TE ACOMPA\u00d1AN AL BAJAR ======
     - Pantalla ancha: el panel de l\u00e1minas se desplaza (translateY) para seguir visible mientras bajas.
     - Ancho medio o estrecho: las l\u00e1minas pasan a una bandeja fija en la parte inferior de la pantalla.
     Se calcula con JavaScript, as\u00ed que funciona aunque el contenedor de eXeLearning tenga overflow oculto. */
  function queueF() {
    if (fRAF) { return; }
    fRAF = window.requestAnimationFrame(follow);
  }
  function follow() {
    fRAF = 0;
    var box = $('#vx-poolbox'), col = $('#vx-poolcol');
    if (!box || !col) { return; }
    var dock = root.classList.contains('vx-w-m') || root.classList.contains('vx-w-s');
    if (!dock) {
      dockShown = false;
      box.classList.remove('vx-docked');
      box.style.left = ''; box.style.width = ''; box.style.display = '';
      if (!S || !S.on) { box.style.transform = ''; return; }
      var cr = col.getBoundingClientRect();
      var y = 12 + (window.__rdVt || 0) - cr.top;
      var mx = Math.max(0, cr.height - box.offsetHeight);
      y = Math.max(0, Math.min(y, mx));
      box.style.transform = y > 0 ? 'translateY(' + Math.round(y) + 'px)' : '';
      return;
    }
    box.style.transform = '';
    var left = root.querySelectorAll('.vx-cell .vx-tile').length;
    var vh = window.innerHeight;
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var rr = root.getBoundingClientRect();
    var br = $('.vx-board').getBoundingClientRect();
    var show = !!(S && S.on) && left > 0 && rr.top < vh - 120 && rr.bottom > 160 && br.top < vh - 60;
    box.classList.add('vx-docked');
    if (show) {
      var l = Math.max(0, rr.left);
      box.style.left = Math.round(l) + 'px';
      box.style.width = Math.round(Math.min(rr.right, vw) - l) + 'px';
      box.style.display = '';
    } else {
      box.style.display = 'none';
    }
    dockShown = show;
  }
  function queueW() {
    if (wTimer) { return; }
    wTimer = window.requestAnimationFrame(function () { wTimer = 0; setW(); });
  }

  /* ====== ARRANQUE ====== */
  root.classList.add('vx-app');
  root.setAttribute('lang', 'es');
  root.innerHTML = coverHTML() + gameHTML();
  winEl.innerHTML = winHTML();
  document.body.appendChild(winEl);
  winEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b) { act(b.getAttribute('data-act')); }
  });
  winEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { act('review'); return; }
    if (e.key === 'Tab') {
      var btns = Array.prototype.slice.call(winEl.querySelectorAll('button'));
      if (!btns.length) { return; }
      var first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  setW();
  document.addEventListener('scroll', queueF, { capture: true, passive: true });
  window.addEventListener('resize', queueF);
  if (window.ResizeObserver) { new ResizeObserver(queueW).observe(root); }
  else { window.addEventListener('resize', queueW); }
})();
</script>

<style>
/* Solo tiene efecto dentro de un iframe: las variables las rellena el script de abajo.
   Sin ellas (página abierta directamente) los valores son 0 y todo queda como en el original. */
.vx-win,.dx-win,.bx-win,.qx-win,.dx-zoom{border-top:var(--rd-vt,0px) solid transparent;border-bottom:var(--rd-fb,0px) solid transparent}
.vx-pool.vx-docked{margin-bottom:var(--rd-fb,0px)!important}
</style>
<script>
/* Dentro de un iframe más alto que la ventana, "fixed" se refiere a todo el marco y no a lo que se ve.
   Este ajuste averigua qué parte del marco está a la vista (columna de centinelas con IntersectionObserver)
   para centrar ahí las ventanas y colocar la bandeja flotante. Fuera de un iframe no hace nada. */
(function () {
  var enMarco = false;
  try { enMarco = window.self !== window.top; } catch (e) { enMarco = true; }
  if (!enMarco || !window.IntersectionObserver) { return; }
  var PASO = 20, caja = null, io = null, estado = {}, ultimo = "", raiz = document.documentElement;
  function resumir() {
    var alto = window.innerHeight, t = null, b = null, k, i, vt, vb, clave;
    for (k in estado) {
      if (estado[k]) { i = +k; if (t === null || i < t) { t = i; } if (b === null || i > b) { b = i; } }
    }
    if (t === null) { return; }
    /* se redondea hacia dentro: es preferible usar un poco menos de la zona visible que salirse de ella */
    vt = (t === 0) ? 0 : (t + 1) * PASO;
    vb = (b >= Math.ceil(alto / PASO) - 1) ? alto : b * PASO;
    if (vb <= vt) { return; }
    clave = vt + ":" + vb + ":" + alto;
    if (clave === ultimo) { return; }
    ultimo = clave;
    window.__rdVt = vt;
    raiz.style.setProperty("--rd-vt", vt + "px");
    raiz.style.setProperty("--rd-fb", Math.max(0, alto - vb) + "px");
    try { document.dispatchEvent(new Event("scroll")); } catch (e) {}
  }
  function montar() {
    var alto = window.innerHeight, n = Math.ceil(alto / PASO), i, s;
    if (io) { io.disconnect(); }
    if (caja && caja.parentNode) { caja.parentNode.removeChild(caja); }
    estado = {};
    ultimo = "";
    caja = document.createElement("div");
    caja.setAttribute("aria-hidden", "true");
    caja.style.cssText = "position:fixed;left:0;top:0;width:1px;height:100vh;pointer-events:none;visibility:hidden";
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { estado[e.target.getAttribute("data-i")] = e.isIntersecting; });
      resumir();
    });
    for (i = 0; i < n; i++) {
      s = document.createElement("div");
      s.setAttribute("data-i", i);
      s.style.cssText = "position:absolute;left:0;top:" + (i * PASO) + "px;width:1px;height:" + PASO + "px";
      caja.appendChild(s);
      io.observe(s);
    }
    document.body.appendChild(caja);
  }
  montar();
  window.addEventListener("resize", montar);
})();
</script>
<script>
/* Si esta página va dentro de un iframe, avisa a la página que la contiene de la altura que necesita
   (solo tiene efecto si esa página tiene un receptor; si no, no hace nada). */
(function () {
  if (window.parent === window) { return; }
  var ultimo = -1;
  function enviar() {
    var h = document.body.offsetHeight;
    if (h && h !== ultimo) {
      ultimo = h;
      try { window.parent.postMessage({ tipo: "rd-alto", alto: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("load", enviar);
  window.addEventListener("resize", enviar);
  if (window.ResizeObserver) { new window.ResizeObserver(enviar).observe(document.body); }
  else { window.setInterval(enviar, 500); }
})();
</script>
