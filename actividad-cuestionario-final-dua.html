<script>
(function () {

  /* ====== DATOS (preguntas, respuestas, retroalimentaciones y pistas) ====== */
  var DATA = [{"n":1,"q":"En una oficina de delineaci\u00f3n se prepara, con una aplicaci\u00f3n CAD 2D como AutoCAD, QCAD o LibreCAD, el plano de una pieza que se fabricar\u00e1 en un taller mec\u00e1nico. Para que las dimensiones del modelo sean fiables y el plano pueda imprimirse a diferentes tama\u00f1os, \u00bfc\u00f3mo debe trabajar en el dibujo 2D?","o":[{"t":"Dibujar la pieza con sus medidas reales y establecer la escala al preparar la presentaci\u00f3n o la impresi\u00f3n.","ok":true,"pin":false},{"t":"Dibujar la pieza directamente a la escala a la que se vaya a imprimir.","ok":false,"pin":false},{"t":"Dibujar la pieza con sus medidas reales y aplicar un coeficiente de reducci\u00f3n propio de CAD.","ok":false,"pin":false},{"t":"Ajustar las dimensiones de la pieza para que ocupe todo el formato DIN A0.","ok":false,"pin":false}],"fb":"En una aplicaci\u00f3n CAD 2D, la geometr\u00eda se dibuja normalmente a tama\u00f1o real (escala 1:1). La escala se establece despu\u00e9s, al organizar la presentaci\u00f3n o preparar la impresi\u00f3n, por lo que el mismo modelo puede representarse en distintos formatos sin modificar sus dimensiones.","h":"Piensa en el momento en que se fija la escala. En un CAD 2D la geometr\u00eda se dibuja normalmente a tama\u00f1o real (escala 1:1) y es despu\u00e9s, al organizar la presentaci\u00f3n o preparar la impresi\u00f3n, cuando se decide c\u00f3mo se mostrar\u00e1: as\u00ed el mismo modelo sirve para distintos formatos sin tocar sus dimensiones."},{"n":2,"q":"Un estudio de arquitectura de Espa\u00f1a prepara planos que deben seguir criterios comunes de representaci\u00f3n para facilitar la comunicaci\u00f3n con otros profesionales. \u00bfQu\u00e9 organismo ejerce en Espa\u00f1a la funci\u00f3n de organismo nacional de normalizaci\u00f3n?","o":[{"t":"UNE.","ok":true,"pin":false},{"t":"DIN.","ok":false,"pin":false},{"t":"ISO.","ok":false,"pin":false},{"t":"ANSI.","ok":false,"pin":false}],"fb":"UNE es el organismo nacional de normalizaci\u00f3n en Espa\u00f1a y se encarga de elaborar y publicar normas t\u00e9cnicas espa\u00f1olas. DIN corresponde al organismo alem\u00e1n, ISO desarrolla normas de \u00e1mbito internacional y ANSI es el organismo estadounidense.","h":"F\u00edjate en el \u00e1mbito de cada organismo: uno es alem\u00e1n, otro es estadounidense, otro tiene alcance internacional y solo uno es el organismo nacional de normalizaci\u00f3n de Espa\u00f1a, el que elabora y publica las normas t\u00e9cnicas espa\u00f1olas."},{"n":3,"q":"En una oficina t\u00e9cnica se prepara la documentaci\u00f3n de una reforma de vivienda y se decide imprimir uno de los planos en formato DIN A4. \u00bfQu\u00e9 afirmaci\u00f3n describe correctamente este formato?","o":[{"t":"Todas son correctas.","ok":true,"pin":true},{"t":"Es la mitad de un formato DIN A3.","ok":false,"pin":false},{"t":"Tiene unas dimensiones de 210 \u00d7 297 mm.","ok":false,"pin":false},{"t":"Su superficie equivale a la cuarta parte de un formato DIN A2.","ok":false,"pin":false}],"fb":"El formato DIN A4 mide 210 \u00d7 297 mm. Se obtiene al dividir por la mitad un DIN A3 y su superficie equivale a la cuarta parte de un DIN A2; por tanto, las tres afirmaciones describen correctamente este formato.","h":"Comprueba las afirmaciones una por una: el DIN A4 mide 210 \u00d7 297 mm, se obtiene al dividir por la mitad un DIN A3 y su superficie equivale a la cuarta parte de un DIN A2. Si las tres encajan, \u00bfqu\u00e9 opci\u00f3n las recoge todas?"},{"n":4,"q":"En el plano de montaje de una m\u00e1quina se representa mediante un corte un conjunto formado por varias piezas met\u00e1licas contiguas. Para distinguir claramente los diferentes componentes, \u00bfc\u00f3mo debe realizarse el rayado de sus superficies seccionadas seg\u00fan la norma UNE-EN ISO 128-3:2022?","o":[{"t":"Las l\u00edneas de rayado deben diferenciarse entre piezas contiguas mediante direcciones distintas o separaciones diferentes.","ok":true,"pin":false},{"t":"Las l\u00edneas deben mantener siempre la misma direcci\u00f3n y la misma separaci\u00f3n en todas las piezas contiguas.","ok":false,"pin":false},{"t":"Es obligatorio modificar simult\u00e1neamente la direcci\u00f3n y la separaci\u00f3n de las l\u00edneas de rayado en cada pieza.","ok":false,"pin":false},{"t":"Todas las piezas contiguas deben presentar un rayado id\u00e9ntico, independientemente de que sean componentes diferentes.","ok":false,"pin":false}],"fb":"La norma UNE-EN ISO 128-3:2022, establece que las piezas o componentes contiguos deben diferenciarse mediante l\u00edneas de rayado que presenten direcciones distintas o separaciones diferentes. No es necesario modificar ambos par\u00e1metros simult\u00e1neamente. Adem\u00e1s, la separaci\u00f3n entre l\u00edneas debe elegirse en proporci\u00f3n al tama\u00f1o de las superficies rayadas, respetando las distancias m\u00ednimas establecidas en la norma UNE-EN ISO 128-2.","h":"La norma UNE-EN ISO 128-3:2022 pide que las piezas o componentes contiguos se distingan por su rayado, y para ello basta con que cambie una de sus caracter\u00edsticas, la direcci\u00f3n de las l\u00edneas o su separaci\u00f3n; no es necesario modificar ambas a la vez. Descarta las opciones que exigen no cambiar nada o cambiarlo todo."},{"n":5,"q":"En el plano de una carcasa dise\u00f1ada para un equipo industrial, se incluye una secci\u00f3n para mostrar la forma exacta de la superficie que aparece al atravesar la pieza con un plano imaginario. \u00bfQu\u00e9 informaci\u00f3n debe recoger esa representaci\u00f3n?","o":[{"t":"\u00danicamente la superficie de contacto entre la pieza y el plano secante.","ok":true,"pin":false},{"t":"La superficie de contacto entre la pieza y el plano secante y la parte de la pieza situada detr\u00e1s de ese plano.","ok":false,"pin":false},{"t":"\u00danicamente la parte de la pieza situada detr\u00e1s del plano secante.","ok":false,"pin":false},{"t":"Solo una parte de la superficie de contacto entre la pieza y el plano secante.","ok":false,"pin":false}],"fb":"Una secci\u00f3n representa \u00fanicamente la superficie de contacto entre la pieza y el plano secante. En cambio, un corte muestra esa superficie y, adem\u00e1s, la parte del objeto que queda situada detr\u00e1s del plano de corte.","h":"Una secci\u00f3n representa \u00fanicamente la superficie de contacto entre la pieza y el plano secante. Si adem\u00e1s se mostrara la parte del objeto que queda detr\u00e1s de ese plano, ya no ser\u00eda una secci\u00f3n, sino un corte."},{"n":6,"q":"Una empresa de mobiliario necesita elaborar el alzado, la planta y el perfil de una mesa para incluirlos en sus planos de fabricaci\u00f3n. \u00bfQu\u00e9 sistema de representaci\u00f3n constituye la base de estas vistas normalizadas?","o":[{"t":"El sistema di\u00e9drico.","ok":true,"pin":false},{"t":"El sistema de planos acotados.","ok":false,"pin":false},{"t":"El sistema isom\u00e9trico.","ok":false,"pin":false},{"t":"El sistema c\u00f3nico.","ok":false,"pin":false}],"fb":"Las vistas normalizadas se obtienen mediante proyecciones ortogonales propias del sistema di\u00e9drico. Este sistema permite representar un objeto mediante vistas relacionadas \u2014como el alzado, la planta y los perfiles\u2014 y describir con precisi\u00f3n su forma.","h":"Las vistas normalizadas (alzado, planta y perfiles) se obtienen mediante proyecciones ortogonales. Ese procedimiento es propio del sistema de representaci\u00f3n que relaciona unas vistas con otras para describir con precisi\u00f3n la forma de un objeto."},{"n":7,"q":"En el plano de fabricaci\u00f3n de un eje cil\u00edndrico, el equipo de delineaci\u00f3n debe se\u00f1alar el eje longitudinal de la pieza para indicar su simetr\u00eda y facilitar su mecanizado. \u00bfQu\u00e9 tipo de l\u00ednea debe utilizar?","o":[{"t":"Una l\u00ednea de trazo y punto.","ok":true,"pin":false},{"t":"Una l\u00ednea de trazos.","ok":false,"pin":false},{"t":"Una l\u00ednea continua gruesa.","ok":false,"pin":false},{"t":"Una l\u00ednea continua fina.","ok":false,"pin":false}],"fb":"Las l\u00edneas de trazo y punto se utilizan para representar ejes y l\u00edneas de simetr\u00eda. Las l\u00edneas de trazos indican normalmente aristas o contornos ocultos, mientras que las l\u00edneas continuas se emplean para contornos visibles y otros elementos del dibujo.","h":"Las l\u00edneas de trazos suelen indicar aristas o contornos ocultos y las l\u00edneas continuas se emplean para contornos visibles y otros elementos. Los ejes y las l\u00edneas de simetr\u00eda tienen su propio tipo de l\u00ednea, que alterna trazo largo y punto."},{"n":8,"q":"Un estudio de dise\u00f1o gr\u00e1fico debe ampliar el s\u00edmbolo de una marca para utilizarlo tanto en una tarjeta como en un r\u00f3tulo de gran tama\u00f1o, sin deformar su aspecto. \u00bfQu\u00e9 condici\u00f3n geom\u00e9trica deben cumplir el dibujo original y su ampliaci\u00f3n para que sean semejantes?","o":[{"t":"Mantener la misma forma, con los \u00e1ngulos correspondientes iguales y los lados correspondientes proporcionales.","ok":true,"pin":false},{"t":"Tener la misma \u00e1rea total, aunque sus \u00e1ngulos y su contorno sean diferentes.","ok":false,"pin":false},{"t":"Mantener la misma orientaci\u00f3n en el espacio y el mismo grosor de l\u00ednea.","ok":false,"pin":false},{"t":"Tener todos los lados de la misma longitud, independientemente de sus \u00e1ngulos.","ok":false,"pin":false}],"fb":"La semejanza conserva la forma: los \u00e1ngulos correspondientes deben ser iguales y los lados correspondientes proporcionales. El tama\u00f1o puede cambiar, pero no la forma; por eso, ni la igualdad de \u00e1reas ni la orientaci\u00f3n determinan por s\u00ed solas la semejanza.","h":"La semejanza conserva la forma: el tama\u00f1o puede cambiar, pero no la forma. Piensa en qu\u00e9 deben cumplir los \u00e1ngulos correspondientes y los lados correspondientes; la igualdad de \u00e1reas o la orientaci\u00f3n no bastan por s\u00ed solas."},{"n":9,"q":"En un estudio de arquitectura se debe representar en un plano la longitud de una parcela. Para calcular la escala, dispone de la medida real y de la medida correspondiente en el dibujo. \u00bfQu\u00e9 regla debe respetar antes de aplicar la f\u00f3rmula de la escala?","o":[{"t":"Expresar siempre la medida del dibujo en metros y la medida real en mil\u00edmetros.","ok":false,"pin":false},{"t":"Expresar ambas medidas \u2014la del dibujo y la real\u2014 en la misma unidad.","ok":true,"pin":false},{"t":"Multiplicar previamente la medida real por cien, con independencia de la unidad utilizada.","ok":false,"pin":false},{"t":"Utilizar unidades diferentes, siempre que se indiquen en el cajet\u00edn del plano.","ok":false,"pin":false}],"fb":"Para calcular correctamente la escala, la medida del dibujo y la medida real deben expresarse en la misma unidad, por ejemplo, ambas en cent\u00edmetros o ambas en mil\u00edmetros. As\u00ed, la relaci\u00f3n entre las dos magnitudes es una raz\u00f3n sin unidades.","h":"La escala es una raz\u00f3n entre dos medidas y debe quedar sin unidades. Para conseguirlo, las dos medidas tienen que estar expresadas de la misma manera, por ejemplo ambas en cent\u00edmetros o ambas en mil\u00edmetros."},{"n":10,"q":"Una empresa de dise\u00f1o industrial necesita mostrar el interior de la carcasa de una bomba para que el equipo de fabricaci\u00f3n pueda conocer la disposici\u00f3n de sus componentes. Para preparar la representaci\u00f3n en corte, \u00bfc\u00f3mo se define el plano de corte?","o":[{"t":"Como una l\u00ednea fina continua que une el alzado con la planta.","ok":false,"pin":false},{"t":"Como la l\u00e1mina de papel DIN A1 delimitada por sus m\u00e1rgenes.","ok":false,"pin":false},{"t":"Como la herramienta f\u00edsica que utiliza una fresadora para separar el material.","ok":false,"pin":false},{"t":"Como una superficie imaginaria que atraviesa virtualmente la pieza para mostrar su estructura interior.","ok":true,"pin":false}],"fb":"El plano de corte es una superficie imaginaria que atraviesa la pieza. Al representar el objeto como si se hubiera cortado por ese plano, se pueden mostrar sus cavidades, componentes y otros elementos interiores que no ser\u00edan visibles desde el exterior.","h":"El plano de corte no es una herramienta f\u00edsica ni una l\u00ednea o una l\u00e1mina del dibujo: es una superficie imaginaria que atraviesa la pieza para poder mostrar cavidades, componentes y otros elementos interiores que desde fuera no se ven."}];

  root.addEventListener('click', function (e) {
    var tg = e.target, b = tg.closest ? tg.closest('[data-act]') : null;
    if (b && root.contains(b) && !b.disabled) { act(b.getAttribute('data-act'), b); }
  });
  winEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (b) { act(b.getAttribute('data-act'), b); }
  });
  root.addEventListener('keydown', function (e) {
    if (!S.on || S.done || S.locked || S.phase === 'inter') { return; }
    if (e.ctrlKey || e.metaKey || e.altKey) { return; }
    var k = e.key, i = -1;
    if (/^[a-dA-D]$/.test(k)) { i = k.toUpperCase().charCodeAt(0) - 65; }
    else if (/^[1-4]$/.test(k)) { i = parseInt(k, 10) - 1; }
    if (i >= 0) { e.preventDefault(); pick(i); }
  });
  winEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeWin(); return; }
    if (e.key === 'Tab') {
      var btns = Array.prototype.slice.call(winEl.querySelectorAll('button'));
      if (!btns.length) { return; }
      var first = btns[0], last = btns[btns.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  setW();
  if (window.ResizeObserver) { try { new ResizeObserver(queueW).observe(root); } catch (e) { } }
  window.addEventListener('resize', queueW);
  window.addEventListener('load', queueW);
  root.setAttribute('data-qx', '1');
  INSTANCES.push({ root: root, win: winEl });
  }

  /* ====== ARRANQUE DE LOS CONTENEDORES ====== */
  function built(el) { return el.getAttribute('data-qx') === '1' && !!el.querySelector('.qx-screen'); }
  function fail(el, e) {
    try { if (window.console && console.error) { console.error('Actividad qx:', e); } } catch (x) { }
    el.innerHTML = '<div style="padding:20px;color:#121212;background:#f4edda;font-family:Arial,sans-serif;border:4px solid #121212">' +
      'No se ha podido iniciar la actividad. Detalle t\u00e9cnico: ' + String(e && e.message ? e.message : e).replace(/</g, ' ') + '</div>';
  }
  function scan() {
    var els = document.querySelectorAll('[id="qx-root"]'), i, el, k, ent;
    for (k = INSTANCES.length - 1; k >= 0; k--) {
      ent = INSTANCES[k];
      if (!document.documentElement.contains(ent.root)) {
        if (ent.win && ent.win.parentNode) { ent.win.parentNode.removeChild(ent.win); }
        INSTANCES.splice(k, 1);
      }
    }
    for (i = 0; i < els.length; i++) {
      el = els[i];
      if (built(el)) { continue; }
      el.__qxTries = (el.__qxTries || 0) + 1;
      if (el.__qxTries > 3) { continue; }
      try { init(el); } catch (e) { fail(el, e); }
    }
  }
  var scanTimer = 0;
  function later() {
    if (scanTimer) { return; }
    scanTimer = setTimeout(function () { scanTimer = 0; scan(); }, 150);
  }
  scan();
  if (window.MutationObserver) {
    try { new MutationObserver(later).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) { }
  }
  window.addEventListener('load', later);
})();
</script>

<script>
/* Si esta página va dentro de un iframe, avisa a la página que la contiene de la altura que necesita
   (solo tiene efecto si esa página tiene un receptor; si no, no hace nada). */
(function () {
  if (window.parent === window) { return; }
  var ultimo = -1;
  function enviar() {
    var h = document.body.offsetHeight;
    if (h && h !== ultimo) {
      ultimo = h;
      try { window.parent.postMessage({ tipo: "rd-alto", alto: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("load", enviar);
  window.addEventListener("resize", enviar);
  if (window.ResizeObserver) { new window.ResizeObserver(enviar).observe(document.body); }
  else { window.setInterval(enviar, 500); }
})();
</script>
