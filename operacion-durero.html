<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operación Durero</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{padding:12px 0 26px}
#rd-durero.rd-juego{margin:0 auto}
</style>
<style>
/* Georgia dibuja las cifras "de texto" (el 0 parece una «o»). Para las cifras se usa una fuente con cifras de altura de mayúscula. */
@font-face{font-family:"RdCifras";font-style:normal;font-weight:400;unicode-range:U+0030-0039;size-adjust:104%;src:local("Times New Roman"),local("TimesNewRomanPSMT"),local("Liberation Serif"),local("Tinos"),local("Times")}
@font-face{font-family:"RdCifras";font-style:normal;font-weight:700;unicode-range:U+0030-0039;size-adjust:104%;src:local("Times New Roman Bold"),local("TimesNewRomanPS-BoldMT"),local("Liberation Serif Bold"),local("Tinos Bold"),local("Times Bold"),local("Times-Bold")}
@font-face{font-family:"RdCifras";font-style:italic;font-weight:400;unicode-range:U+0030-0039;size-adjust:104%;src:local("Times New Roman Italic"),local("TimesNewRomanPS-ItalicMT"),local("Liberation Serif Italic"),local("Tinos Italic"),local("Times Italic"),local("Times-Italic")}
.rd-juego{position:relative;box-sizing:border-box;max-width:880px;margin:14px auto;padding:0;overflow:hidden;color:#e9e2d0;font:16px/1.5 "RdCifras",Georgia,"Times New Roman",serif;text-align:left;border:3px solid #3b3123;border-radius:14px;background:#0d1013 radial-gradient(ellipse at 50% 0%,#1d252d 0%,#0d1013 72%);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 90px rgba(0,0,0,.7)}
.rd-juego *{box-sizing:border-box}
.rd-juego a{color:#ffd27a}
.rd-juego p{margin:0 0 8px}
.rd-juego button{font-family:inherit}

/* ---------- Portada ---------- */
.rd-juego .rd-portada{padding:26px 20px 16px;text-align:center}
.rd-juego .rd-sello{display:inline-block;transform:rotate(-5deg);margin:0 0 10px;padding:2px 12px;border:3px solid #d8402f;color:#d8402f;font:700 .95rem "Courier New",Courier,monospace;letter-spacing:.32em;text-transform:uppercase;opacity:.92}
.rd-juego .rd-lugar{margin:0 0 8px;font:700 .78rem/1.4 "Courier New",Courier,monospace;letter-spacing:.2em;text-transform:uppercase;color:#ffb347}
.rd-juego .rd-t1{margin:6px 0 0;font:400 1.15rem/1 Impact,Haettenschweiler,"Arial Black","Arial Narrow Bold",sans-serif;letter-spacing:.55em;text-indent:.55em;text-transform:uppercase;color:#ffb347}
.rd-juego .rd-t2{margin:2px 0 6px;font:400 3.5rem/1.05 Impact,Haettenschweiler,"Arial Black","Arial Narrow Bold",sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#f6ead0;text-shadow:0 3px 0 #5b1a12,0 0 30px rgba(255,150,50,.38)}
.rd-juego .rd-sub{margin:0 0 6px;font:italic 1.2rem/1.35 "RdCifras",Georgia,serif;color:#eadfc4}
.rd-juego .rd-franja{height:8px;max-width:340px;margin:14px auto;border-radius:2px;background:repeating-linear-gradient(-45deg,#e0b84f 0 10px,#15181b 10px 20px);opacity:.85}
.rd-juego .rd-foto{position:relative;width:100%;max-width:340px;margin:20px auto 22px;padding:10px;background:#000;border:1px solid #5c4b2a;box-shadow:0 0 0 4px #14171a,0 0 0 5px #5c4b2a,0 18px 36px rgba(0,0,0,.65),0 0 70px rgba(216,64,47,.2)}
.rd-juego .rd-foto img{display:block;width:100%;height:auto;margin:0;border:0}
.rd-juego .rd-esq{position:absolute;width:20px;height:20px;border:3px solid #ffb347}
.rd-juego .rd-e1{left:-9px;top:-9px;border-right:0;border-bottom:0}
.rd-juego .rd-e2{right:-9px;top:-9px;border-left:0;border-bottom:0}
.rd-juego .rd-e3{left:-9px;bottom:-9px;border-right:0;border-top:0}
.rd-juego .rd-e4{right:-9px;bottom:-9px;border-left:0;border-top:0}
.rd-juego .rd-objetivo{margin:-8px 0 0;font:700 .74rem "Courier New",Courier,monospace;letter-spacing:.2em;text-transform:uppercase;color:#d8c9a3}
.rd-juego .rd-brief{max-width:620px;margin:14px auto 4px;font:1rem/1.55 "RdCifras",Georgia,serif;color:#d9cfb6}
.rd-juego .rd-equipo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
.rd-juego .rd-carta{display:flex;gap:10px;align-items:flex-start;padding:12px;text-align:left;background:linear-gradient(#1d242b,#13171b);border:1px solid #4e4126;border-radius:8px}
.rd-juego .rd-carta svg{flex:none;width:44px;height:44px}
.rd-juego .rd-carta b{display:block;margin:0 0 2px;font:700 .74rem "Courier New",Courier,monospace;letter-spacing:.12em;text-transform:uppercase;color:#ffb347}
.rd-juego .rd-carta span{display:block;font:.86rem/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#d9cfb6}
.rd-juego .rd-azar{display:inline-block;max-width:600px;margin:0 0 18px;padding:8px 14px;border:1px dashed #b8923a;border-radius:6px;font:.82rem/1.45 "Courier New",Courier,monospace;color:#f0dfb0;background:rgba(224,184,79,.07)}
.rd-juego .rd-boton{display:inline-block;margin:0;padding:14px 38px;border:0;border-radius:6px;font:400 1.2rem/1.2 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#241a05;background:linear-gradient(#ffdc82,#dba72c 55%,#b98515);box-shadow:0 4px 0 #6f4f0b,0 10px 22px rgba(0,0,0,.55);cursor:pointer;animation:rdLatido 2.2s ease-in-out infinite}
.rd-juego .rd-boton:hover{background:linear-gradient(#ffe7a3,#e8b53a 55%,#c9961c)}
.rd-juego .rd-boton:active{transform:translateY(3px);box-shadow:0 1px 0 #6f4f0b,0 4px 10px rgba(0,0,0,.5)}
.rd-juego .rd-boton:focus-visible,.rd-juego .rd-btn:focus-visible,.rd-juego .rd-opcion:focus-visible{outline:3px solid #ffffff;outline-offset:3px}
.rd-juego .rd-credito{margin:18px 0 0;font:.72rem/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#9a927b}
.rd-juego .rd-credito a{color:#d1b673}

/* ---------- Juego ---------- */
.rd-juego .rd-hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(#1a2026,#10141a);border-bottom:2px solid #3b3123;font:700 .76rem "Courier New",Courier,monospace;letter-spacing:.1em;text-transform:uppercase;color:#cdbf99}
.rd-juego .rd-hud b{color:#ffb347}
.rd-juego .rd-fichas{display:flex;gap:8px}
.rd-juego .rd-chip{display:inline-block;padding:2px 10px;border:1px solid #4e4126;border-radius:99px;background:#0d1013;color:#7d7560;transition:all .25s}
.rd-juego .rd-chip.rd-on{border-color:#ffcf66;background:#ffcf66;color:#241a05;box-shadow:0 0 14px rgba(255,190,80,.65)}
.rd-juego .rd-maquina{position:relative;margin:12px 12px 0;padding:12px 8px 8px;border:2px solid #40382a;border-radius:12px;background:radial-gradient(ellipse at 50% 25%,#26303a,#0e1215 78%);box-shadow:inset 0 0 40px rgba(0,0,0,.85),0 0 0 1px #000;transition:box-shadow .2s}
.rd-juego .rd-maquina.rd-bien{box-shadow:inset 0 0 40px rgba(0,0,0,.85),0 0 0 2px #e0b84f,0 0 28px rgba(255,200,90,.55)}
.rd-juego .rd-maquina.rd-error{box-shadow:inset 0 0 40px rgba(0,0,0,.85),0 0 0 2px #e0453a,0 0 28px rgba(224,69,58,.6)}
.rd-juego .rd-maquina.rd-sacude{animation:rdSacude .45s linear}
.rd-juego .rd-remache{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9d2c0,#6a6454 60%,#2a2820)}
.rd-juego .rd-r1{left:6px;top:6px}.rd-juego .rd-r2{right:6px;top:6px}.rd-juego .rd-r3{left:6px;bottom:6px}.rd-juego .rd-r4{right:6px;bottom:6px}
.rd-juego .rd-svgbox svg{display:block;width:100%;height:auto;overflow:visible}
.rd-juego .rd-placa{margin:2px 0 0;text-align:center;font:700 .66rem "Courier New",Courier,monospace;letter-spacing:.2em;text-transform:uppercase;color:#8d856e}
.rd-juego .rd-tambor text{font:700 27px "Courier New",Courier,monospace;fill:#8a8163;text-anchor:middle}
.rd-juego .rd-tambor.rd-activo text{fill:#ffcf66}
.rd-juego .rd-tambor.rd-error text{fill:#ff6b5e}
.rd-juego .rd-tambor.rd-fija text{fill:#ffe08a}
.rd-juego .rd-tambor.rd-fija{animation:rdFlash 1.1s ease-out}
.rd-juego .rd-tambor.rd-victoria{animation:rdOla 1.8s ease-in-out infinite}
.rd-juego .rd-visor{pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,205,90,.95))}
.rd-juego .rd-lente{animation:rdPulso 1.3s ease-in-out infinite}

.rd-juego .rd-zona{padding:0 0 12px}
.rd-juego .rd-ficha{position:relative;margin:12px 12px 0;padding:16px 16px 14px;color:#241c10;background:linear-gradient(180deg,#f2e9d0,#e4d8ba);border-left:10px solid #8a2b20;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.rd-juego .rd-ficha-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;padding:0 0 6px;border-bottom:1px dashed #a7966b;font:700 .72rem "Courier New",Courier,monospace;letter-spacing:.13em;text-transform:uppercase;color:#6c5a36}
.rd-juego .rd-pendiente{padding:0 7px;border:2px solid #b02d1f;color:#b02d1f;transform:rotate(-3deg)}
.rd-juego .rd-enun{margin:0 0 12px;font:700 1.18rem/1.4 "RdCifras",Georgia,serif;color:#1c150a}
.rd-juego .rd-opcion{display:flex;gap:12px;align-items:flex-start;width:100%;margin:0 0 9px;padding:10px 12px;text-align:left;font:1rem/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#241c10;background:#f8f1dd;border:2px solid #9b8756;border-radius:8px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.rd-juego .rd-opcion:hover:not(:disabled){transform:translateX(3px);border-color:#b8382a;background:#fff8e2}
.rd-juego .rd-opcion:disabled{cursor:default}
.rd-juego .rd-let{flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#241c10;color:#ffd97a;font:700 .9rem "Courier New",Courier,monospace}
.rd-juego .rd-opcion.rd-sel{border-color:#c28a12;background:#fff1c4}
.rd-juego .rd-opcion.rd-bien{border-color:#1e8e4a;background:#d9f2df}
.rd-juego .rd-opcion.rd-mal{border-color:#c0392b;background:#f9d9d3}
.rd-juego .rd-opcion.rd-descartada{opacity:.4;text-decoration:line-through;background:#d9cfb4;border-style:dashed}
.rd-juego .rd-charles{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;padding:10px 12px;color:#efe5c8;background:#1a2027;border:2px solid #c9a24b;border-radius:10px;font:italic .98rem/1.45 "RdCifras",Georgia,serif}
.rd-juego .rd-charles svg{flex:none;width:46px;height:46px}
.rd-juego .rd-charles b{display:block;margin:0 0 2px;font:700 .72rem "Courier New",Courier,monospace;font-style:normal;letter-spacing:.13em;text-transform:uppercase;color:#ffb347}
.rd-juego .rd-aviso{margin:12px 0 0;padding:12px 14px;border-left:6px solid;border-radius:8px;font:.98rem/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;animation:rdAviso .25s ease-out}
.rd-juego .rd-aviso.rd-ok{color:#10321c;background:#d9f2df;border-color:#1e8e4a}
.rd-juego .rd-aviso.rd-err{color:#4a120b;background:#f9d9d3;border-color:#c0392b}
.rd-juego .rd-aviso-t{margin:0 0 4px;font:400 1.1rem/1.2 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:.07em;text-transform:uppercase}
.rd-juego .rd-aviso p{margin:0 0 6px}
.rd-juego .rd-aviso .rd-charles{margin:6px 0 4px}
.rd-juego .rd-acciones{margin:12px 0 0;text-align:right}
.rd-juego .rd-btn{display:inline-block;margin:0;padding:10px 22px;border:0;border-radius:6px;font:400 1rem/1.2 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#241a05;background:linear-gradient(#ffdc82,#dba72c 55%,#b98515);box-shadow:0 3px 0 #6f4f0b;cursor:pointer}
.rd-juego .rd-btn:hover{background:linear-gradient(#ffe7a3,#e8b53a 55%,#c9961c)}
.rd-juego .rd-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6f4f0b}

.rd-juego .rd-pend{margin:12px 12px 0;padding:18px 16px;text-align:center;border:2px dashed #b8923a;border-radius:10px;background:rgba(224,184,79,.07)}
.rd-juego .rd-pend .rd-aviso-t{color:#ffcf66;font-size:1.3rem}
.rd-juego .rd-final{margin:12px 12px 0;padding:20px 16px;text-align:center;border:2px solid #e0b84f;border-radius:10px;background:radial-gradient(ellipse at 50% 0%,#3a2d10,#14110a 75%);box-shadow:0 0 34px rgba(255,190,80,.3)}
.rd-juego .rd-final-t{margin:0 0 8px;font:400 2rem/1.15 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:.03em;color:#ffe08a;text-shadow:0 2px 0 #5b3a05,0 0 24px rgba(255,190,80,.5)}
.rd-juego .rd-codigo{display:inline-block;margin:4px 0;padding:6px 14px;font:700 1.5rem "Courier New",Courier,monospace;letter-spacing:.14em;color:#ffe08a;background:#0a0c0e;border:2px solid #c9a24b;border-radius:6px;word-break:break-all;user-select:all}
.rd-juego .rd-stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0;padding:0;list-style:none}
.rd-juego .rd-stats li{margin:0;padding:6px 12px;font:.84rem/1.3 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#e9e2d0;background:rgba(255,255,255,.06);border:1px solid #5c4b2a;border-radius:6px}
.rd-juego .rd-stats b{color:#ffcf66}

.rd-juego.rd-estrecho .rd-portada{padding:20px 12px 14px}
.rd-juego.rd-estrecho .rd-t2{font-size:2.5rem}
.rd-juego.rd-estrecho .rd-t1{font-size:.95rem;letter-spacing:.4em;text-indent:.4em}
.rd-juego.rd-estrecho .rd-equipo{grid-template-columns:1fr}
.rd-juego.rd-estrecho .rd-ficha{margin:10px 8px 0;padding:12px 12px 12px;border-left-width:7px}
.rd-juego.rd-estrecho .rd-maquina{margin:10px 8px 0}
.rd-juego.rd-estrecho .rd-pend,.rd-juego.rd-estrecho .rd-final{margin:10px 8px 0}
.rd-juego.rd-estrecho .rd-final-t{font-size:1.6rem}
.rd-juego.rd-estrecho .rd-codigo{font-size:1.05rem;letter-spacing:.08em}
.rd-juego.rd-estrecho .rd-enun{font-size:1.08rem}

@keyframes rdLatido{0%,100%{box-shadow:0 4px 0 #6f4f0b,0 10px 22px rgba(0,0,0,.55),0 0 0 rgba(255,200,90,0)}50%{box-shadow:0 4px 0 #6f4f0b,0 10px 22px rgba(0,0,0,.55),0 0 26px rgba(255,200,90,.65)}}
@keyframes rdSacude{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,2px)}30%{transform:translate(6px,-2px)}45%{transform:translate(-5px,-1px)}60%{transform:translate(5px,2px)}75%{transform:translate(-3px,1px)}}
@keyframes rdFlash{0%{filter:drop-shadow(0 0 0 rgba(255,220,120,0))}30%{filter:drop-shadow(0 0 14px rgba(255,220,120,1))}100%{filter:drop-shadow(0 0 3px rgba(255,220,120,.6))}}
@keyframes rdOla{0%,100%{filter:drop-shadow(0 0 2px rgba(255,220,120,.5))}50%{filter:drop-shadow(0 0 13px rgba(255,230,140,1))}}
@keyframes rdPulso{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes rdAviso{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.rd-juego *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
/* ==========================================================================
   CONFIGURACIÓN DE LA MISIÓN
   En el iDevice Texto libre se pone el marcador:  <div id="rd-durero"></div>

   codigo           frase-código (sin espacios): una letra por pregunta
   numPreguntas     preguntas que se sortean en cada intento (= letras del código)
   barajarOpciones  true/false: cambiar el orden de las respuestas en cada pregunta
   banco            todas las preguntas posibles
     pregunta · opciones (lista) · correcta (nº de la opción correcta, la primera es 0)
     retro (retroalimentación) · pista (pista de Charles Le Maistre)
   ========================================================================== */
window.RQ_MISIONES = window.RQ_MISIONES || {};
window.RQ_MISIONES["durero"] = {
  codigo: "NORMALIZARESUNIFICAR",
  numPreguntas: 20,
  barajarOpciones: true,
  textos: {
    sello: "Secreto",
    lugar: "Berlín · 25 de noviembre de 1945 · Sector soviético",
    titulo1: "Operación",
    titulo2: "Durero",
    subtitulo: "Descifra el código y abre la cámara secreta",
    objetivo: "Objetivo: la pieza roja de Durero",
    historia: "Estás en el búnker de la Cancillería, en el Berlín en ruinas de 1945. La puerta de la cámara secreta solo cede ante un código secreto: cada respuesta correcta hace girar una rueda del mecanismo y te revela una de sus letras."
  },
  banco: [
    {"pregunta": "Si una joyera dibuja un anillo a escala 1:1, ¿qué tipo de escala está utilizando?", "opciones": ["Escala de reducción, porque el dibujo representa el anillo más pequeño que en la realidad.", "Escala natural, donde las dimensiones del dibujo coinciden exactamente con las reales.", "Escala gráfica, porque permite medir directamente las dimensiones representadas.", "Escala de ampliación, porque el dibujo representa el anillo más grande que en la realidad."], "correcta": 1, "retro": "La escala 1:1 es una escala natural (E = 1): las medidas del dibujo coinciden con las medidas reales. No es una escala de ampliación ni de reducción.", "pista": "Fíjate en los dos números de la escala: si son iguales, el dibujo no se hace ni más grande ni más pequeño que el objeto."},
    {"pregunta": "Un albañil revisa los planos de un centro comercial dibujados a escala 1:100. ¿Qué tipo de escala se está empleando?", "opciones": ["Escala natural, porque el dibujo conserva las dimensiones reales del edificio.", "Escala de reducción, ya que el dibujo es de menor tamaño que el objeto real.", "Escala de ampliación, porque el denominador representa cien unidades del papel.", "Escala gráfica, porque se expresa mediante una barra graduada."], "correcta": 1, "retro": "La escala 1:100 es de reducción porque el dibujo representa el objeto a un tamaño cien veces menor que el real.", "pista": "Lee la escala como «dibujo : realidad». Si el número del dibujo es mucho menor que el de la realidad, ¿cómo es el plano respecto al edificio?"},
    {"pregunta": "Un tornero analiza un plano con escala 5:1 para fabricar un engranaje minúsculo. ¿Qué indica esta escala?", "opciones": ["Es una escala natural de alta precisión para entornos mineros.", "Es una escala de ampliación, el dibujo es 5 veces mayor que la pieza real.", "Es una escala gráfica, porque se representa mediante una barra graduada.", "Es una escala de reducción, la pieza real es 5 veces mayor que el dibujo."], "correcta": 1, "retro": "En la escala 5:1, el dibujo es cinco veces mayor que el objeto real; por tanto, se trata de una escala de ampliación.", "pista": "En 5:1 el primer número (el dibujo) es mayor que el segundo (la realidad). Piensa en cómo se dibuja una pieza diminuta para poder verla bien."},
    {"pregunta": "Una decoradora está dibujando el croquis de una tienda de un centro comercial. ¿Cómo se define un croquis en dibujo técnico?", "opciones": ["Es una representación exclusivamente en 3D generada mediante un programa CAD.", "Es un esquema en el que no es necesario conservar las proporciones del objeto.", "Es un dibujo preliminar realizado a mano alzada, sin una escala rigurosa, pero que mantiene, en lo posible, las proporciones del objeto.", "Es un plano definitivo de taller dibujado con escala exacta e instrumentos de alta precisión."], "correcta": 2, "retro": "El croquis es un dibujo a mano alzada que no requiere una escala rigurosa, pero procura mantener las proporciones del objeto. Se utiliza en las fases iniciales de estudio y para comunicar ideas.", "pista": "Un croquis sirve para plasmar ideas en las primeras fases: se hace a mano alzada. Busca la opción que no pide rigor de escala, pero sí cuidar las proporciones."},
    {"pregunta": "Si tuvieras que explicar a tu alumnado el concepto de escala, ¿qué definición utilizarías?", "opciones": ["Es la diferencia de longitud que existe entre el papel A4 y el plano real impreso.", "Es la relación constante entre una medida trazada en el dibujo y la medida real correspondiente del objeto.", "Es la suma de la medida del dibujo más la tolerancia fijada por el fabricante.", "Es el grosor del trazo empleado para dibujar las aristas visibles de un mueble."], "correcta": 1, "retro": "La escala expresa la relación entre una medida del dibujo y la medida real correspondiente: E = dibujo / realidad. Ambas medidas deben expresarse en las mismas unidades.", "pista": "La escala es un cociente: una medida del dibujo dividida entre la medida real del mismo objeto. Busca la definición que hable de esa relación."},
    {"pregunta": "Al pasar a tinta el plano de tu nueva cocina, ¿qué relación de grosor se utiliza habitualmente entre las líneas finas y las gruesas?", "opciones": ["Proporción de 1:2 entre línea fina y línea gruesa; la línea gruesa tiene el doble de grosor que la fina.", "Proporción de 1 : 1 (todas las líneas del plano tienen exactamente la misma anchura).", "Proporción de 3 : 1 (la línea fina mide el triple que la gruesa).", "Proporción de 1 : 5 (la línea gruesa es cinco veces superior a la fina)."], "correcta": 0, "retro": "La relación habitual entre los grosores de las líneas finas (por ejemplo, cotas, ejes y rayados) y las gruesas (por ejemplo, contornos vistos) es de 1:2.", "pista": "Cotas, ejes y rayados van con línea fina; los contornos vistos, con línea gruesa. La proporción habitual es de las más sencillas: ni iguales ni exagerada."},
    {"pregunta": "Una ingeniera está diseñando un frigorífico inteligente. ¿Qué vista elegirá como alzado?", "opciones": ["Cualquiera de los perfiles elegidos al azar por el técnico.", "La vista posterior que oculta la mayor parte de las conexiones eléctricas.", "La vista inferior, que representa el objeto desde abajo.", "La vista frontal que mejor representa la forma y proporciones del objeto en su posición de uso."], "correcta": 3, "retro": "El alzado es la vista principal. Se elige la orientación que mejor muestra la forma y las características del objeto en su posición habitual de uso o montaje.", "pista": "El alzado es la vista principal del objeto. Piensa desde dónde se aprecia mejor su forma cuando se usa de manera habitual."},
    {"pregunta": "Un arquitecto necesita representar una pared de 10 m de longitud en un plano a escala 1:50. ¿Cuánto medirá la pared en el dibujo?", "opciones": ["10 cm", "50 cm", "5 cm", "20 cm"], "correcta": 3, "retro": "Primero, convierte la longitud real a centímetros: 10 m = 1.000 cm. Después, divide entre 50: 1.000 cm × (1/50) = 20 cm. En el plano, la pared medirá 20 cm.", "pista": "Pasa primero los 10 m a centímetros y después divide entre el denominador de la escala."},
    {"pregunta": "En el plano de una cómoda, dibujado a escala 1:50, una carpintera mide 4 cm. ¿A qué longitud real corresponde esa medida?", "opciones": ["400 cm (4 m reales)", "100 cm (1 m real)", "50 cm (0,5 m reales)", "200 cm (2 m reales)"], "correcta": 3, "retro": "Para obtener la medida real, multiplica la medida del dibujo por 50: 4 cm × 50 = 200 cm = 2 m.", "pista": "Ahora el camino es el inverso: multiplica los 4 cm del plano por el denominador de la escala y expresa el resultado en metros."},
    {"pregunta": "A la hora de expresar la escala del plano de tu casa, ¿cuáles de las siguientes formas son válidas?", "opciones": ["Como grado sexagesimal (45°) o en formato ISO de papel (A4).", "Como proporción (1:2), como fracción (1/2) o como número decimal (0,5).", "Como metros por segundo o kilogramos por centímetro cuadrado.", "Únicamente en porcentaje (%) o mediante símbolos de acotación."], "correcta": 1, "retro": "La escala es un cociente sin unidades. Puede expresarse como proporción (1:2), como fracción (1/2) o mediante su valor decimal (0,5).", "pista": "La escala es un cociente sin unidades. Piensa en las formas de escribir un cociente: con dos puntos, con barra de fracción o como número decimal."},
    {"pregunta": "El capitán de un petrolero consulta una carta náutica en la que aparece una escala gráfica. ¿Cuál es su principal ventaja?", "opciones": ["Permite eliminar la necesidad de acotar los elementos del mapa marítimo.", "Modifica automáticamente las unidades de metros a millas náuticas sin cálculos.", "Mantiene la correspondencia con las distancias representadas cuando la carta se amplía o se reduce proporcionalmente mediante una fotocopia.", "Evita el uso de márgenes y cajetín en el documento impreso."], "correcta": 2, "retro": "La escala gráfica se amplía o se reduce junto con el plano, por lo que conserva la proporción entre su longitud y las distancias representadas, siempre que el cambio de tamaño sea proporcional.", "pista": "Si fotocopias el plano reduciéndolo a la mitad, la barra graduada también se encoge. ¿Qué consigue eso respecto a las distancias que representa?"},
    {"pregunta": "Una escenógrafa utiliza una tira de cartulina independiente, con graduaciones, para trasladar medidas de un plano. ¿Cómo se denomina?", "opciones": ["Cajetín móvil.", "Escala natural.", "Escala volante.", "Normalización de taller."], "correcta": 2, "retro": "La escala volante es una escala gráfica dibujada en un soporte independiente y móvil, como una tira de papel o cartulina, que permite trasladar medidas al plano.", "pista": "Es una escala gráfica dibujada en un soporte independiente, como una tira de cartulina que se desplaza sobre el plano. Busca un nombre que sugiera movimiento."},
    {"pregunta": "Estás preparando una conferencia sobre normalización para una reunión de la ISO. ¿Cómo definirías formalmente el término «normalización»?", "opciones": ["La ley estatal obligatoria que fija los precios de fabricación de piezas metálicas.", "El proceso de digitalización de planos manuales mediante escáneres 3D.", "La obligación de dibujar todos los proyectos exclusivamente a escala 1:1.", "El proceso de elaborar y aplicar criterios y reglas consensuados para facilitar la representación y documentación de objetos y sistemas técnicos."], "correcta": 3, "retro": "La normalización establece criterios y reglas consensuados que facilitan una interpretación clara, coherente y compartida de la documentación técnica.", "pista": "Normalizar es poner de acuerdo a muchos: reglas consensuadas para que todos interpreten un plano de la misma manera. Descarta lo que hable de leyes, precios o escáneres."},
    {"pregunta": "Estás explicando al equipo técnico los conceptos básicos de normalización. ¿Cuál es la diferencia entre una «norma» y un «reglamento técnico»?", "opciones": ["La norma es dictada por el Ayuntamiento y el reglamento por la Unión Europea.", "La norma solo se aplica a la madera y el reglamento exclusivamente al acero.", "La norma suele ser de aplicación voluntaria, salvo que una disposición la haga obligatoria; el reglamento técnico es una disposición de obligado cumplimiento dictada por una autoridad competente.", "No existe ninguna diferencia; ambos términos son sinónimos legales idénticos."], "correcta": 2, "retro": "Las normas se elaboran mediante consenso y, por regla general, son voluntarias. Los reglamentos técnicos son disposiciones obligatorias dictadas por la autoridad competente.", "pista": "Una norma nace del consenso y, por regla general, se aplica de forma voluntaria; un reglamento lo impone una autoridad competente."},
    {"pregunta": "Al revisar la documentación de una vivienda en la aldea de El Rocío, en Almonte (Huelva), observas que se citan normas UNE. ¿A qué ámbito geográfico corresponde esta denominación?", "opciones": ["Europa.", "Almonte.", "España.", "Internacional."], "correcta": 2, "retro": "UNE significa «Una Norma Española» e identifica las normas españolas; EN se refiere a normas europeas e ISO a normas internacionales.", "pista": "Descompón las siglas: la «U» es de «Una», la «N» de «Norma»… ¿qué crees que significa la «E» final?"},
    {"pregunta": "Vas a la papelería a comprar una hoja de formato A0 de la serie A. ¿Qué superficie tiene?", "opciones": ["1 metro cuadrado (1 m²).", "2 metros cuadrados.", "100 centímetros cuadrados.", "0,5 metros cuadrados."], "correcta": 0, "retro": "El formato A0 de la serie A se define para tener una superficie nominal de 1 m².", "pista": "El formato A0 se define por su superficie, y esa cifra es muy fácil de recordar en el sistema métrico: una unidad redonda."},
    {"pregunta": "Tienes varios dibujos en formatos de la serie A que quieres colocar en un panel informativo. ¿Qué relación existe entre el lado mayor y el lado menor de estos formatos?", "opciones": ["Relación igual a la raíz cuadrada de dos (√2).", "Relación del número áureo (1,618).", "Relación constante de 3 a 4.", "Relación de 1 a 2 exactamente."], "correcta": 0, "retro": "En los formatos de la serie A, la relación entre el lado mayor y el menor es √2. Esta proporción permite obtener formatos semejantes al dividir una hoja por la mitad.", "pista": "Al partir una hoja de la serie A por la mitad, las dos mitades han de ser semejantes a la original. Eso exige una relación entre lados que sale de una raíz cuadrada."},
    {"pregunta": "Para diseñar la portada de tu proyecto, divides una hoja A3 en dos partes iguales. ¿Qué formato tendrá cada parte?", "opciones": ["A2.", "C4.", "B2.", "A4."], "correcta": 3, "retro": "Al dividir una hoja A3 en dos partes iguales mediante un corte paralelo al lado menor, se obtienen dos hojas A4.", "pista": "Cada vez que divides una hoja de la serie A en dos partes iguales, el número del formato sube una unidad."},
    {"pregunta": "Antes de dibujar las vistas de un engranaje mecánico, preparas los márgenes de la hoja. ¿Qué anchura debe tener el margen izquierdo para permitir el archivado o la encuadernación?", "opciones": ["50 mm.", "5 mm.", "20 mm.", "2 mm."], "correcta": 2, "retro": "Según UNE-EN ISO 5457, el margen izquierdo, incluido el marco, es de 20 mm y puede utilizarse para archivar o encuadernar el plano. Los otros tres márgenes son de 10 mm.", "pista": "Es el margen más ancho de los cuatro (los otros tres miden 10 mm), pero solo lo justo para poder archivar o encuadernar el plano."},
    {"pregunta": "Has terminado el plano de taller de unos auriculares inalámbricos. ¿Dónde debes situar el cajetín y cuál es su anchura máxima?", "opciones": ["Centro exacto del plano, con ancho libre sin límite.", "Esquina inferior izquierda, cubriendo todo el margen de 20 mm.", "Esquina inferior derecha, con un ancho máximo de 180 mm.", "Esquina superior izquierda, con un ancho de 210 mm."], "correcta": 2, "retro": "En los formatos A0 a A3, el cajetín se sitúa en la esquina inferior derecha del espacio de dibujo. Su anchura total es de 180 mm, para ajustarse al formato A4 al plegar el plano.", "pista": "La anchura del cajetín encaja en un A4 al plegar el plano: son los 210 mm del ancho del folio menos los márgenes laterales (20 mm + 10 mm)."},
    {"pregunta": "Un delineante está plegando un plano de formato A0. ¿A qué formato final debe reducirse para archivarlo y qué requisito debe cumplir el plegado?", "opciones": ["Debe recortarse por los bordes hasta que quepa en un sobre C5.", "Debe doblarse hasta tamaño A4 de modo que el cajetín quede visible en la portada.", "Debe enrollarse en un tubo cilíndrico de 100 mm de diámetro.", "Debe doblarse en abanico hasta A5 ocultando el cajetín en el interior."], "correcta": 1, "retro": "La norma UNE 1027 establece el plegado de los planos para su archivo en formato A4 (210 × 297 mm). El cajetín debe quedar visible en la portada, de modo que pueda leerse sin desplegar el plano.", "pista": "La norma UNE 1027 dobla el plano hasta el tamaño de folio más habitual y exige que el cajetín quede a la vista en la portada, sin desplegar nada."},
    {"pregunta": "Walter, un compañero de Estados Unidos, te envía los planos de una central hidroeléctrica. Están dibujados según el sistema de proyección americano. ¿Dónde se sitúa la planta (vista superior) respecto al alzado?", "opciones": ["En una hoja independiente anexa al plano.", "Debajo del alzado.", "A la derecha del perfil izquierdo.", "Encima del alzado."], "correcta": 3, "retro": "En el sistema de proyección americano (tercer diedro), la planta se coloca encima del alzado; las vistas se sitúan en el mismo lado desde el que se observan.", "pista": "En el sistema americano, cada vista se sitúa del mismo lado desde el que se observa el objeto. ¿Desde dónde miras para ver la planta?"},
    {"pregunta": "Al consultar los planos de una caja de cambios, ¿qué símbolo gráfico permite identificar en el cajetín el sistema de proyección utilizado (europeo o americano)?", "opciones": ["La representación de un tronco de cono junto a su vista circular.", "Una flecha doble inclinada a 45°.", "Las iniciales EUR o USA dentro de una circunferencia.", "Un triángulo equilátero con una cruz interior."], "correcta": 0, "retro": "El símbolo combina la representación de un tronco de cono con su vista circular. La disposición relativa de ambas figuras permite distinguir el sistema de proyección europeo del americano.", "pista": "Es un pequeño dibujo, no unas siglas ni una flecha: un sólido de revolución dibujado junto a su vista circular."},
    {"pregunta": "Una diseñadora industrial está creando una lámpara de techo. ¿Qué criterio debe seguir para elegir el número de vistas necesarias para definirla en un plano?", "opciones": ["Dibujar como mínimo cuatro vistas sin importar la sencillez de la lámpara.", "Dibujar únicamente las vistas estrictamente necesarias, evitando redundancias y ambigüedades.", "Sustituir todas las vistas por un croquis coloreado sin cotas.", "Dibujar siempre las seis vistas principales de forma obligatoria en todos los planos."], "correcta": 1, "retro": "Deben representarse solo las vistas necesarias para definir el objeto sin ambigüedad. En piezas sencillas, una o dos vistas, acompañadas de los símbolos adecuados cuando corresponda, pueden ser suficientes.", "pista": "Dibujar de más es tan malo como dibujar de menos. ¿Qué criterio evita a la vez las redundancias y las ambigüedades?"},
    {"pregunta": "Un joyero prepara el plano de un anillo para fabricarlo. ¿Qué establece el principio de «unicidad y plenitud» en la acotación?", "opciones": ["Las cotas solo pueden colocarse en el plano de conjunto y nunca en el de despiece.", "El diseñador puede omitir el 50% de las medidas si la pieza es simétrica.", "Todas las medidas necesarias deben figurar en el plano, pero ninguna debe duplicarse ni repetirse.", "Cada cota debe escribirse tres veces para garantizar que no haya errores de lectura."], "correcta": 2, "retro": "Un plano bien acotado contiene todas las cotas necesarias para su fabricación (plenitud), sin repetir ninguna medida (unicidad).", "pista": "Plenitud: están todas las medidas que hacen falta. Unicidad: cada medida aparece una sola vez. Une ambas ideas."},
    {"pregunta": "Has diseñado un bolígrafo inteligente y vas a enviar el plano a fábrica. ¿Qué exige el principio de «lectura directa» de las cotas?", "opciones": ["Las dimensiones se leen midiendo con una regla directamente sobre el papel impreso.", "El fabricante no debe realizar cálculos, sumas, restas ni deducciones para conocer una medida real.", "Las cifras deben escribirse en letra manuscrita cursiva.", "Todas las cifras de cota deben leerse de derecha a izquierda obligatoriamente."], "correcta": 1, "retro": "La acotación debe ofrecer los datos de manera directa de modo que el fabricante no tenga que calcular medidas deduciendo otras cotas.", "pista": "El taller no quiere hacer ninguna operación para conocer una medida: ni sumas, ni restas, ni deducciones. ¿Qué opción lo recoge?"},
    {"pregunta": "Al revisar el plano de un motor eléctrico, te piden que incluyas cotas auxiliares. ¿Qué características tienen y cómo deben representarse?", "opciones": ["Son cotas que sustituyen a las funcionales y se representan en línea discontinua.", "Son las cotas que indican el precio de los tubos y se escriben en rojo.", "Son cotas complementarias no imprescindibles para la fabricación y se escriben siempre entre paréntesis.", "Son cotas de alta precisión técnica que se destacan con un marco rectangular."], "correcta": 2, "retro": "Las cotas auxiliares aportan información complementaria y no son necesarias para definir por sí solas la fabricación. Se escriben entre paréntesis.", "pista": "«Auxiliar» significa que ayuda, pero que no es imprescindible para fabricar. Recuerda el signo de puntuación que se emplea para señalar un dato meramente informativo."},
    {"pregunta": "Al acotar una estantería, ¿cuánto deben sobrepasar las líneas auxiliares de cota a la línea de cota correspondiente?", "opciones": ["10 mm exactamente.", "20 mm coincidiendo con el margen izquierdo.", "Aproximadamente 2 mm.", "No deben sobresalir nada, terminando justo en el cruce."], "correcta": 2, "retro": "Las líneas auxiliares de cota parten de la arista y sobrepasan la línea de cota unos 2 mm para delimitar con claridad el tramo medido.", "pista": "Las líneas auxiliares sobrepasan la línea de cota solo un poco, lo justo para delimitar con claridad el tramo medido."},
    {"pregunta": "Al acotar el diámetro de un elemento circular o cilíndrico, ¿cómo debe indicarse la cifra de cota según UNE-EN ISO 129-1:2019?", "opciones": ["Escribiendo el símbolo R delante de cualquier diámetro.", "Añadiendo el símbolo Ø únicamente si el diámetro supera 1 m.", "Escribiendo la cifra sin símbolo cuando se representa una circunferencia.", "Anteponiendo el símbolo Ø a la cifra de cota."], "correcta": 3, "retro": "La norma UNE-EN ISO 129-1:2019 establece que el símbolo Ø debe preceder al valor cuando se acota el diámetro de un elemento circular o cilíndrico.", "pista": "Se usa un círculo atravesado por una barra, y debe acompañar a la cifra siempre que se acota un diámetro, no solo en casos especiales."},
    {"pregunta": "En un taller observan una «cruz de San Andrés» (dos líneas finas diagonales en forma de X) dibujada sobre una cara de una pieza. ¿Qué significa?", "opciones": ["Representa el centro de gravedad del componente mecánico.", "Señala un defecto de fabricación que requiere soldadura de emergencia.", "Indica que esa zona debe ser cortada con sierra de diamante.", "Informa que esa superficie en particular es completamente plana."], "correcta": 3, "retro": "La cruz de San Andrés se utiliza para indicar que una superficie es plana cuando su representación podría confundirse con una superficie curva.", "pista": "Dos líneas finas cruzadas sobre una cara evitan una confusión: que esa superficie se tome por una superficie curva."},
    {"pregunta": "Para acotar el diámetro de una esfera, ¿qué símbolo debe colocarse delante de la cifra de cota?", "opciones": ["E.", "SØ.", "3DØ.", "RØ."], "correcta": 1, "retro": "El símbolo SØ indica el diámetro de una esfera; SR se utiliza para indicar su radio.", "pista": "El diámetro se indica con Ø. Para una esfera, delante se añade una letra que recuerda a la palabra «esfera»."},
    {"pregunta": "Al elegir el sistema de acotación para una pieza, propones utilizar la acotación en paralelo. ¿Cuál es su principal ventaja frente a la acotación en serie?", "opciones": ["Reduce la acumulación de tolerancias entre cotas consecutivas, ya que todas parten de una referencia común.", "Ocupa mucho menos espacio visual en la lámina de dibujo.", "Elimina la necesidad de escribir cifras de cota.", "Permite usar escalas de reducción de forma simultánea."], "correcta": 0, "retro": "En la acotación en paralelo, cada medida se toma desde una referencia común, lo que evita que las tolerancias de cotas consecutivas se acumulen como puede ocurrir en la acotación en serie.", "pista": "Si todas las cotas parten de una misma referencia, los pequeños errores de cada medida no se van acumulando. Busca esa ventaja."},
    {"pregunta": "En un plano destinado a fabricar una pieza mediante control numérico, ¿qué sistema de acotación define puntos mediante distancias respecto a unos ejes ortogonales (X e Y)?", "opciones": ["Acotación en serie.", "Acotación de roturas.", "Acotación por coordenadas.", "Acotación por perspectivas."], "correcta": 2, "retro": "La acotación por coordenadas localiza puntos mediante valores referidos a un origen y a unos ejes de referencia. Este sistema puede facilitar la programación de procesos de fabricación por control numérico.", "pista": "Imagina unos ejes cartesianos con un origen: cada punto se define por su distancia a X y a Y. Es el sistema que mejor entiende una máquina de control numérico."},
    {"pregunta": "Al rotular planos de una promoción de viviendas, ¿qué diferencia existe entre los tipos A y B y cuál se utiliza con mayor frecuencia?", "opciones": ["El tipo A es manuscrito y el tipo B es de imprenta, siendo el tipo B el más utilizado.", "El tipo A tiene un grosor de trazo menor que el tipo B; este último es el de uso más habitual.", "El tipo A se usa solo en arquitectura y el tipo B solo en aviación, siendo el tipo A el más utilizado.", "El tipo A solo permite letras minúsculas y el tipo B, únicamente mayúsculas; ambos se utilizan por igual."], "correcta": 1, "retro": "El tipo A utiliza un grosor de trazo menor que el tipo B. En dibujo técnico es habitual utilizar el tipo B.", "pista": "La diferencia entre los tipos A y B está en el grosor del trazo. En dibujo técnico se utiliza con más frecuencia uno de los dos."},
    {"pregunta": "Al representar una pieza mecánica, debes elegir qué perfil (vista lateral) dibujar. ¿Qué criterio debe primar?", "opciones": ["Elegir el perfil que muestre la pieza en escala de ampliación.", "Escoger la vista lateral que ofrezca mayor claridad y reduzca al máximo el uso de líneas ocultas.", "Seleccionar el perfil que requiera el mayor número de cotas complejas.", "Elegir siempre el perfil izquierdo por convenio internacional sin importar la pieza."], "correcta": 1, "retro": "Conviene elegir el perfil que muestre con mayor claridad la forma de la pieza y reduzca, en lo posible, la necesidad de representar aristas ocultas con líneas discontinuas.", "pista": "Un buen perfil es el que se entiende de un vistazo y obliga a dibujar muy pocas líneas de trazos (las de las aristas ocultas)."},
    {"pregunta": "Para representar el interior de una pieza mecánica, debes decidir si emplear un corte o una sección. ¿Cuál es la diferencia entre ambos?", "opciones": ["No hay diferencia; ambos términos son totalmente intercambiables en los planos.", "El corte se aplica a plásticos y la sección se utiliza únicamente en tuberías de cobre.", "La sección representa los contornos visibles situados detrás del plano de corte; el corte muestra únicamente los contornos que quedan en ese plano.", "El corte representa la sección junto con los contornos visibles situados detrás del plano de corte; la sección representa únicamente los contornos que quedan en el plano de corte."], "correcta": 3, "retro": "Según UNE-EN ISO 128-3:2022, el corte añade a la sección los contornos visibles situados detrás del plano de corte; la sección muestra únicamente los contornos que quedan en ese plano.", "pista": "El corte «añade» algo a la sección. Pregúntate qué más se ve cuando miras desde fuera una pieza cortada: todo lo que queda detrás del plano de corte."},
    {"pregunta": "Te han entregado los planos de planta de tu nueva casa. En arquitectura, ¿a qué equivalen conceptualmente?", "opciones": ["A una vista frontal de la fachada principal desde la calle.", "Al cálculo de costes del hormigón de la cimentación.", "A una perspectiva 3D fotorrealista nocturna vista desde el norte.", "A una sección horizontal imaginaria del edificio, vista desde arriba y tomada a una altura convencional que permite mostrar la distribución interior."], "correcta": 3, "retro": "Según la convención arquitectónica, la planta representa una sección horizontal imaginaria del edificio, vista desde arriba, que permite mostrar la distribución de muros, puertas, ventanas y espacios interiores.", "pista": "Imagina que cortas el edificio con un plano horizontal a una altura conveniente y lo miras desde arriba. ¿Qué dibujo obtienes?"},
    {"pregunta": "Un delineante está representando una pieza mecánica que tiene varias aristas ocultas desde el punto de vista elegido. ¿Qué tipo de línea debe utilizar para representarlas?", "opciones": ["Línea continua ancha, para destacar las aristas que no se ven.", "Línea de trazos estrecha (fina), para representar las aristas ocultas.", "Línea continua estrecha (fina), para indicar las superficies interiores.", "Línea de trazo y punto ancha, para señalar los contornos ocultos."], "correcta": 1, "retro": "Las aristas y los contornos ocultos se representan mediante líneas de trazos estrechas (finas), lo que permite distinguirlos de los elementos visibles, representados con líneas continuas.", "pista": "Lo que no se ve se dibuja «a trozos»: con una línea interrumpida y estrecha, para no confundirlo con lo visible."},
    {"pregunta": "Una técnica está dibujando el corte de una pieza para mostrar su estructura interior. ¿Cómo debe representar, por lo general, las superficies de material atravesadas por el plano de corte?", "opciones": ["Mediante líneas discontinuas gruesas, separadas a distancias irregulares.", "Mediante líneas continuas gruesas, dispuestas en forma de cuadrícula.", "Mediante líneas continuas estrechas (finas), paralelas y regularmente espaciadas, normalmente inclinadas respecto a los contornos.", "Mediante líneas de trazo y punto estrechas (finas), concentradas en el centro de la superficie."], "correcta": 2, "retro": "Las superficies de material atravesadas por el plano de corte se identifican, habitualmente, mediante un rayado formado por líneas continuas estrechas, paralelas y equidistantes. Su inclinación permite distinguir las zonas cortadas de los demás elementos del dibujo.", "pista": "Recuerda un rayado clásico: líneas rectas, finas, paralelas y a igual distancia unas de otras, normalmente inclinadas."},
    {"pregunta": "Estás rotulando un plano de fabricación y necesitas elegir una altura normalizada para las letras y cifras. ¿Cuál de las siguientes medidas pertenece a la serie normalizada de alturas de rotulación?", "opciones": ["4 mm.", "6 mm.", "8 mm.", "5 mm."], "correcta": 3, "retro": "La serie normalizada de alturas de escritura técnica incluye los valores de 2,5; 3,5; 5; 7; 10; 14 y 20 mm. Elegir una altura de esta serie favorece la uniformidad y la legibilidad de los planos.", "pista": "La serie crece, aproximadamente, multiplicando por √2 cada vez: 2,5 · 3,5 · … · 7 · 10 · 14 · 20. ¿Qué valor falta entre 3,5 y 7?"}
  ]

  }

  function rutaRueda(cx, cy, fase) {

      k = "Pregunta " + (i + 1) + ": ";
      if (!q.pregunta) { p.push(k + "falta el enunciado."); }

      var filas = Math.ceil(N / cols);
      var W = (cols - 1) * PASO + 2 * R_PUNTA + 2 * MARGEN;
      var H = (filas - 1) * PASO + 2 * R_PUNTA + MARGEN_SUP + MARGEN_INF;
      var u = "u" + uid;
      var s = '<svg viewBox="0 0 ' + W + " " + H + '" xmlns="http://www.w3.org/2000/svg" focusable="false">' +
        '<defs>' +
        '<radialGradient id="rdLaton' + u + '" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#f6e0a0"/><stop offset=".55" stop-color="#b98c32"/><stop offset="1" stop-color="#5f400d"/></radialGradient>' +
        '<radialGradient id="rdAcero' + u + '" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#dfe5ea"/><stop offset=".55" stop-color="#7c8793"/><stop offset="1" stop-color="#30383f"/></radialGradient>' +
        '<radialGradient id="rdVidrio' + u + '" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#202a33"/><stop offset="1" stop-color="#040608"/></radialGradient>' +
        '</defs>';
      var i, r, c, cx, cy, par, fase, k, ang, hx, hy;
      /* varillas de los ejes, por detrás */
      for (r = 0; r < filas; r++) {
        cy = MARGEN_SUP + R_PUNTA + r * PASO;
        s += '<rect x="0" y="' + (cy - 4) + '" width="' + W + '" height="8" fill="#1b2127"/><rect x="0" y="' + (cy - 4) + '" width="' + W + '" height="2" fill="#323b44"/>';
      }
      var datos = { cx: [], cy: [], dir: [] };
      for (i = 0; i < N; i++) {
        r = Math.floor(i / cols); c = i % cols;
        cx = MARGEN + R_PUNTA + c * PASO;
        cy = MARGEN_SUP + R_PUNTA + r * PASO;
        par = (r + c) % 2;
        fase = par ? (360 / DIENTES) / 2 : 0;
        datos.cx.push(cx); datos.cy.push(cy); datos.dir.push(par ? -1 : 1);
        s += '<g class="rd-rueda">' +
          '<g class="rd-gira">' +
            '<path d="' + rutaRueda(cx, cy, fase) + '" fill="url(#' + (par ? "rdAcero" : "rdLaton") + u + ')" stroke="#120d04" stroke-width="1.4" stroke-linejoin="round"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="35.5" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.8"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>';
        for (k = 0; k < 6; k++) {
          ang = k * 60 + 30 * (par ? 1 : 0);
          hx = cx + 31 * Math.cos(ang * Math.PI / 180); hy = cy + 31 * Math.sin(ang * Math.PI / 180);
          s += '<circle cx="' + hx.toFixed(2) + '" cy="' + hy.toFixed(2) + '" r="3.2" fill="#0e0b05" stroke="rgba(255,255,255,.25)" stroke-width=".8"/>';
        }
        s += '</g>' +
          '<g class="rd-tambor">' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="24.5" fill="#0a0c0e" stroke="#d8b24f" stroke-width="3"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="21.5" fill="url(#rdVidrio' + u + ')"/>' +
            '<text x="' + cx + '" y="' + cy + '" dy=".35em"></text>' +
          '</g>' +
          '<g class="rd-visor" style="display:none">' +
            '<circle class="rd-lente" cx="' + cx + '" cy="' + cy + '" r="28.5" fill="none" stroke="#ffd36b" stroke-width="2.6"/>' +
            '<path fill="none" stroke="#ffd36b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="' +
              'M' + (cx - 34) + " " + (cy - 22) + "V" + (cy - 34) + "H" + (cx - 22) +
              "M" + (cx + 22) + " " + (cy - 34) + "H" + (cx + 34) + "V" + (cy - 22) +
              "M" + (cx + 34) + " " + (cy + 22) + "V" + (cy + 34) + "H" + (cx + 22) +
              "M" + (cx - 22) + " " + (cy + 34) + "H" + (cx - 34) + "V" + (cy + 22) + '"/>' +
          '</g>' +
        '</g>';
      }
      s += "</svg>";
      var caja = raiz.querySelector(".rd-svgbox");
      caja.innerHTML = s;
      mec = {
        cols: cols, caja: caja,
        cx: datos.cx, cy: datos.cy, dir: datos.dir,
        giran: caja.querySelectorAll(".rd-gira"),
        tambores: caja.querySelectorAll(".rd-tambor"),
        textos: caja.querySelectorAll(".rd-tambor text"),
        visores: caja.querySelectorAll(".rd-visor")
      };
      aplicarAngulos();
    }

    function aplicarAngulos() {
      if (!mec) { return; }
      for (var i = 0; i < mec.giran.length; i++) {
        mec.giran[i].setAttribute("transform", "rotate(" + (mec.dir[i] * anim.ang).toFixed(2) + " " + mec.cx[i] + " " + mec.cy[i] + ")");
      }
    }

    function refrescarRuedas() {
      if (!mec || !m) { return; }
      var hechas = 0, letras = [], i, cl;
      for (i = 0; i < N; i++) {
        cl = "rd-tambor";
        if (m.hecha[i]) {
          mec.textos[i].textContent = CODIGO.charAt(i); cl += " rd-fija"; hechas++; letras.push(CODIGO.charAt(i));
        } else {
          letras.push("_");
          if (i === m.activa && m.jam) { mec.textos[i].textContent = "×"; cl += " rd-error"; }
          else { mec.textos[i].textContent = m.glifos[i]; if (i === m.activa && !m.fin) { cl += " rd-activo"; } }
        }
        if (m.fin) { cl += " rd-victoria"; }
        mec.tambores[i].style.animationDelay = m.fin ? (i * 0.09).toFixed(2) + "s" : "0s";
        mec.tambores[i].setAttribute("class", cl);
        mec.visores[i].style.display = (i === m.activa && !m.fin) ? "" : "none";
      }
      mec.caja.setAttribute("aria-label", "Cerradura de la cámara. Código descubierto: " + letras.join(" "));
      var placa = raiz.querySelector(".rd-placa");
      if (placa) { placa.textContent = "Cerradura de la cámara · " + hechas + " de " + N + " ruedas descifradas"; }
    }

    function pintarHUD() {
      var c = m.cur;
      var hud = raiz.querySelector(".rd-hud");
      var pregunta = m.fin ? 'Misión <b>cumplida</b>' : ((c && c.i != null) ? ('Pregunta <b>' + (c.i + 1) + '</b>/' + N) : 'Pendientes');
      var f = c ? c.fallos || 0 : 0;
      hud.innerHTML =
        '<span><b>' + esc(tx("titulo1", "Operación")) + ' ' + esc(tx("titulo2", "Durero")) + '</b></span>' +
        '<span>' + pregunta + (m.ronda > 1 && !m.fin ? ' · repaso' : '') + '</span>' +
        '<span>Letras <b>' + cuenta(m.hecha) + '</b>/' + N + '</span>' +
        '<span class="rd-fichas"><span class="rd-chip' + (f >= 1 ? ' rd-on' : '') + '">50 %</span>' +
        '<span class="rd-chip' + (f >= 2 ? ' rd-on' : '') + '">Charles</span></span>';
    }

    /* --------------------------------------------------------- Bucle de animación */
    function iniciarBucle() {
      if (!anim.raf) { anim.ultimo = 0; anim.raf = window.requestAnimationFrame(bucle); }
    }
    function detenerBucle() {
      if (anim.raf) { window.cancelAnimationFrame(anim.raf); anim.raf = 0; }
    }
    function bucle(ts) {
      if (!mec || !document.body.contains(raiz)) { anim.raf = 0; return; }
      var dt = anim.ultimo ? Math.min((ts - anim.ultimo) / 1000, 0.1) : 0;
      anim.ultimo = ts;
      var t = anim.tarea;
      if (t) {
        if (t.ini == null) { t.ini = ts; }
        var p = Math.min((ts - t.ini) / t.dur, 1);
        t.paso(p, ts);
        if (p >= 1) { anim.tarea = null; if (t.fin) { t.fin(); } }
      } else if (m && !m.jam && !REDUCIDO) {
        anim.ang += anim.vel * dt;
      }
      aplicarAngulos();
      anim.raf = window.requestAnimationFrame(bucle);
    }
    function pulso(el, clase, ms) {
      if (!el) { return; }
      el.className += " " + clase;
      window.setTimeout(function () { el.className = el.className.replace(" " + clase, ""); }, ms);
    }

    function girarAcierto(i, fin) {
      var a0 = anim.ang, giro = REDUCIDO ? 60 : 900, dur = REDUCIDO ? 250 : 1700;
      var texto = mec.textos[i], ultimo = 0, fijada = false;
      anim.tarea = {
        ini: null, dur: dur,
        paso: function (p, ts) {
          anim.ang = a0 + giro * suave(p);
          if (p < 0.8) {
            if (!REDUCIDO && ts - ultimo > 70) { texto.textContent = glifoAzar(); ultimo = ts; }
          } else if (!fijada) {
            fijada = true; texto.textContent = CODIGO.charAt(i);
          }
        },
        fin: function () {
          texto.textContent = CODIGO.charAt(i);
          pulso(raiz.querySelector(".rd-maquina"), "rd-bien", 1000);
          fin();
        }
      };
      iniciarBucle();
    }

    function girarFallo(i, fin) {
      var a0 = anim.ang, giro = REDUCIDO ? 20 : 260, dur = REDUCIDO ? 300 : 1000, corte = 0.5;
      var texto = mec.textos[i], ultimo = 0, parado = false;
      var maquina = raiz.querySelector(".rd-maquina");
      anim.tarea = {
        ini: null, dur: dur,
        paso: function (p, ts) {
          if (p < corte) {
            var q = p / corte;
            anim.ang = a0 + giro * q * q;
            if (!REDUCIDO && ts - ultimo > 60) { texto.textContent = glifoAzar(); ultimo = ts; }
          } else {
            anim.ang = a0 + giro + (REDUCIDO ? 0 : Math.sin((p - corte) * 80) * 2.4 * (1 - p));
            if (!parado) {
              parado = true;
              texto.textContent = "×";
              pulso(maquina, "rd-error", 1200);
              if (!REDUCIDO) { pulso(maquina, "rd-sacude", 480); }
            }
          }
        },
        fin: function () { anim.ang = a0 + giro; fin(); }
      };
      iniciarBucle();
    }

    /* --------------------------------------------------------------- Preguntas */
    function presentar(i) {
      var q = m.q[i], orden = [], k;
      for (k = 0; k < q.opciones.length; k++) { orden.push(k); }
      if (cfg.barajarOpciones !== false) { orden = barajar(orden); }
      m.activa = i; m.jam = false;
      m.cur = { i: i, orden: orden, fallos: 0, descartadas: [], sel: -1, fase: "elige", res: "", aviso: null };
      refrescarRuedas(); pintarHUD(); pintarZona(false);
      verEnPantalla(raiz.querySelector(".rd-maquina"));
    }

    function htmlCharles(texto) {
      return '<div class="rd-charles">' + ICONO_CHARLES + '<div><b>Charles Le Maistre te susurra</b>' + esc(texto) + '</div></div>';
    }

    function htmlOpciones(c, q) {
      var h = "", p, k, cls, dis, desc;
      for (p = 0; p < c.orden.length; p++) {
        k = c.orden[p];
        desc = c.descartadas.indexOf(k) > -1;
        cls = "rd-opcion"; dis = false;
        if (c.fase !== "elige") { dis = true; }
        if (desc && !(c.fase === "resultado" && k === c.sel)) { cls += " rd-descartada"; dis = true; }
        if (k === c.sel && c.fase === "giro") { cls += " rd-sel"; }
        if (k === c.sel && c.fase === "resultado") { cls += (c.res === "bien" ? " rd-bien" : " rd-mal"); }
        h += '<button type="button" class="' + cls + '" data-rd="op" data-o="' + k + '"' + (dis ? " disabled" : "") + '>' +
             '<span class="rd-let">' + "ABCDEFGH".charAt(p) + '</span><span>' + esc(q.opciones[k].texto) + '</span></button>';
      }
      return h;
    }

    function htmlAviso(a) {
      if (!a) { return ""; }
      return '<div class="rd-aviso ' + (a.tipo === "ok" ? "rd-ok" : "rd-err") + '" role="status">' +
        '<div class="rd-aviso-t">' + esc(a.titulo) + '</div>' + a.cuerpo +
        (a.boton ? '<div class="rd-acciones"><button type="button" class="rd-btn" data-rd="' + a.boton.acc + '">' + esc(a.boton.txt) + '</button></div>' : '') +
        '</div>';
    }

    function htmlFinal() {
      var p1 = cuenta(m.primera), rango;
      if (p1 >= N * 0.9) { rango = "Agente de élite"; }
      else if (p1 >= N * 0.7) { rango = "Agente veterano"; }
      else if (p1 >= N * 0.45) { rango = "Agente de campo"; }
      else { rango = "Agente en prácticas"; }
      return '<div class="rd-final">' +
        '<div role="heading" aria-level="3" class="rd-final-t">Código desbloqueado, ¡a por la pieza!</div>' +
        '<p>Código secreto: <span class="rd-codigo">' + esc(CODIGO) + '</span></p>' +
        '<p>Introdúcelo, sin espacios, en el candado para abrir la cámara secreta.</p>' +
        '<ul class="rd-stats">' +
          '<li>Acertadas a la primera: <b>' + p1 + ' de ' + N + '</b></li>' +
          '<li>Comodines del 50 %: <b>' + m.comodines + '</b></li>' +
          '<li>Pistas de Charles: <b>' + m.pistas + '</b></li>' +
          '<li>Rango: <b>' + rango + '</b></li>' +
        '</ul>' +
        '<button type="button" class="rd-boton" data-rd="nueva">Nueva misión</button>' +
        '</div>';
    }

    function htmlPendientes() {
      var n = m.cola.length;
      return '<div class="rd-pend">' +
        '<div class="rd-aviso-t">Vuelta a las pendientes</div>' +
        '<p>' + (n === 1 ? 'Queda 1 rueda sin descifrar.' : 'Quedan ' + n + ' ruedas sin descifrar.') +
        ' Vuelves a ' + (n === 1 ? 'esa pregunta' : 'esas preguntas') + ' con las mismas ayudas: comodín del 50 % y pista de Charles Le Maistre.</p>' +
        '<div class="rd-acciones" style="text-align:center"><button type="button" class="rd-btn" data-rd="pend">Volver a las pendientes</button></div>' +
        '</div>';
    }

    function pintarZona(enfocar) {
      var zona = raiz.querySelector(".rd-zona");
      var c = m.cur, h = "", q;
      if (c.fase === "pend") {
        h = htmlPendientes();
      } else {
        q = m.q[c.i];
        h = '<div class="rd-ficha">' +
          '<div class="rd-ficha-cab"><span>Expediente nº ' + pad2(c.i + 1) + ' · Pregunta ' + (c.i + 1) + ' de ' + N + '</span>' +
          (m.diferida[c.i] ? '<span class="rd-pendiente">Pendiente</span>' : '') + '</div>' +
          (c.fallos >= 2 && c.fase !== "resultado" ? htmlCharles(q.pista) : '') +
          '<p class="rd-enun">' + esc(q.enunciado) + '</p>' +
          htmlOpciones(c, q) +
          htmlAviso(c.aviso) +
          '</div>' + (m.fin ? htmlFinal() : '');
      }
      zona.innerHTML = h;
      if (enfocar) {
        var b = zona.querySelector(".rd-aviso [data-rd]") || zona.querySelector('[data-rd="nueva"]');
        if (b) {
          try { b.focus({ preventScroll: true }); } catch (e) { b.focus(); }
        }
        verEnPantalla(zona.querySelector(".rd-final") || zona.querySelector(".rd-aviso"));
      }
    }

    var enMarco = false, vigilaVer = null, tVer = 0;
    try { enMarco = window.self !== window.top; } catch (e) { enMarco = true; }

    function mostrar(el) {
      var r = el.getBoundingClientRect(), alto = window.innerHeight || document.documentElement.clientHeight;
      /* Dentro de un iframe tan alto como el juego, "nearest" también mueve la página que lo contiene */
      if (enMarco || r.top < 0 || r.bottom > alto) {
        try { el.scrollIntoView({ block: "nearest", behavior: REDUCIDO ? "auto" : "smooth" }); } catch (e) { el.scrollIntoView(false); }
      }
    }

    function ejecutarVer() {
      window.clearTimeout(tVer);
      var el = vigilaVer;
      vigilaVer = null;
      if (el && document.body.contains(el)) { mostrar(el); }
    }

    function verEnPantalla(el) {
      if (!el || !el.getBoundingClientRect || !el.scrollIntoView) { return; }
      if (!enMarco) { mostrar(el); return; }
      /* En un marco, la página que lo contiene ajusta su altura un instante después de que cambie el contenido:
         se espera a ese ajuste (evento resize del marco) y, por si no llega, un respaldo de 220 ms */
      vigilaVer = el;
      window.clearTimeout(tVer);
      tVer = window.setTimeout(ejecutarVer, 220);
    }

    function responder(k) {
      var c = m.cur;
      if (!c || c.fase !== "elige" || c.descartadas.indexOf(k) > -1) { return; }
      var q = m.q[c.i];
      c.sel = k; c.fase = "giro";
      pintarZona(false);
      verEnPantalla(raiz.querySelector(".rd-maquina"));
      if (q.opciones[k].ok) { girarAcierto(c.i, resolverAcierto); }
      else { girarFallo(c.i, function () { resolverFallo(k); }); }
    }

    function resolverAcierto() {
      var c = m.cur, i = c.i, q = m.q[i];
      m.hecha[i] = true;
      if (c.fallos === 0 && !m.diferida[i]) { m.primera[i] = true; }
      m.jam = false;
      c.fase = "resultado"; c.res = "bien";
      var todas = cuenta(m.hecha) === N;
      c.aviso = {
        tipo: "ok", titulo: "¡Engranaje desbloqueado!",
        cuerpo: '<p>Rueda ' + (i + 1) + ' descifrada: letra <b>' + esc(CODIGO.charAt(i)) + '</b>.</p>' +
                (q.retro ? '<p><b>Retroalimentación:</b> ' + esc(q.retro) + '</p>' : ''),
        boton: todas ? null : { acc: "sig", txt: "Siguiente" }
      };
      if (todas) { m.fin = true; }
      refrescarRuedas(); pintarHUD(); pintarZona(true);
    }

    function resolverFallo(k) {
      var c = m.cur, q = m.q[c.i], malas = [], j;
      c.fallos++; c.fase = "resultado"; c.res = "mal"; m.jam = true;
      if (c.fallos === 1) {
        for (j = 0; j < q.opciones.length; j++) { if (!q.opciones[j].ok && j !== k) { malas.push(j); } }
        c.descartadas = [k];
        if (malas.length) { c.descartadas.push(malas[Math.floor(Math.random() * malas.length)]); }
        m.comodines++;
        c.aviso = {
          tipo: "err", titulo: "¡Engranaje atascado!",
          cuerpo: '<p>Respuesta incorrecta. El mecanismo se ha encasquillado.</p>' +
                  '<p><b>Comodín del 50 % activado:</b> se descartan dos respuestas incorrectas. ¡Inténtalo de nuevo!</p>',
          boton: { acc: "reintentar", txt: "Reintentar" }
        };
      } else if (c.fallos === 2) {
        m.pistas++;
        c.aviso = {
          tipo: "err", titulo: "¡Se atasca de nuevo!",
          cuerpo: '<p>Respuesta incorrecta, pero Charles Le Maistre acude en tu ayuda:</p>' + htmlCharles(q.pista),
          boton: { acc: "reintentar", txt: "Reintentar" }
        };
      } else {
        m.diferida[c.i] = true;
        c.aviso = {
          tipo: "err", titulo: "¡El mecanismo se bloquea!",
          cuerpo: '<p>Respuesta incorrecta.</p>' +
                  (q.retro ? '<p><b>Retroalimentación:</b> ' + esc(q.retro) + '</p>' : '') +
                  '<p>Esta pregunta queda pendiente: volverás a ella al final, con las mismas ayudas.</p>',
          boton: { acc: "sig", txt: "Continuar" }
        };
      }
      refrescarRuedas(); pintarHUD(); pintarZona(true);
    }

    function reintentar() {
      var c = m.cur;
      c.fase = "elige"; c.aviso = null; c.sel = -1; m.jam = false;
      refrescarRuedas(); pintarHUD(); pintarZona(false);
    }

    function avanzar() {
      m.pos++;
      if (m.pos < m.cola.length) { presentar(m.cola[m.pos]); return; }
      var pend = [], i;
      for (i = 0; i < N; i++) { if (!m.hecha[i]) { pend.push(i); } }
      if (!pend.length) { return; }
      m.cola = pend; m.pos = 0; m.ronda++;
      m.activa = pend[0]; m.jam = false;
      m.cur = { i: null, fase: "pend", fallos: 0, descartadas: [], aviso: null };
      refrescarRuedas(); pintarHUD(); pintarZona(false);
      verEnPantalla(raiz.querySelector(".rd-maquina"));
    }

    function empezar() {
      nuevaMision();
      anim.ang = 0;
      pintarJuego();
      presentar(m.cola[0]);
      verEnPantalla(raiz);
    }

    /* ------------------------------------------------------------- Eventos */
    raiz.addEventListener("click", function (e) {
      var t = e.target;
      while (t && t !== raiz && !(t.getAttribute && t.getAttribute("data-rd"))) { t = t.parentNode; }
      if (!t || t === raiz) { return; }
      var acc = t.getAttribute("data-rd");
      if (acc === "iniciar" || acc === "nueva") { empezar(); }
      else if (acc === "op") { responder(parseInt(t.getAttribute("data-o"), 10)); }
      else if (acc === "reintentar") { reintentar(); }
      else if (acc === "sig") { avanzar(); }
      else if (acc === "pend") { presentar(m.cola[0]); }
    });

    function ajustarAncho() {
      if (!document.body.contains(raiz)) { return; }
      var w = raiz.clientWidth;
      if (w) {
        var estrecho = w < 560, tiene = raiz.className.indexOf("rd-estrecho") > -1;
        if (estrecho && !tiene) { raiz.className += " rd-estrecho"; }
        else if (!estrecho && tiene) { raiz.className = raiz.className.replace(" rd-estrecho", ""); }
      }
      if (mec && columnas() !== mec.cols) { pintarMecanismo(); refrescarRuedas(); }
    }
    window.addEventListener("resize", ajustarAncho);
    window.addEventListener("resize", function () { if (vigilaVer) { ejecutarVer(); } });
    if (window.ResizeObserver) { new window.ResizeObserver(ajustarAncho).observe(raiz); }

    ajustarAncho();
    pintarPortada();
  }

  function iniciarTodos() {
    var els = document.querySelectorAll('[id^="rd-"]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.getAttribute("data-rd-listo")) { continue; }
      el.setAttribute("data-rd-listo", "1");
      montar(el, el.id.slice(3));
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", iniciarTodos);
  } else {
    iniciarTodos();
  }
})();
</script>

</head>
<body>
<div id="rd-durero"></div>

<script>
/* Si esta página va dentro de un iframe (por ejemplo en eXeLearning), avisa a la página
   que la contiene de la altura que necesita, para que el marco se ajuste sin barras de desplazamiento. */
(function () {
  if (window.parent === window) { return; }
  var ultimo = -1;
  function enviar() {
    var h = document.body.offsetHeight;
    if (h && h !== ultimo) {
      ultimo = h;
      try { window.parent.postMessage({ tipo: "rd-alto", alto: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("load", enviar);
  window.addEventListener("resize", enviar);
  if (window.ResizeObserver) { new window.ResizeObserver(enviar).observe(document.body); }
  else { window.setInterval(enviar, 500); }
})();
</script>
