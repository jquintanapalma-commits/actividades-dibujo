<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Millonario de la normalización</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{padding:12px 10px 28px}
</style>
</head>
<body>
<div class="qm-embed-wrap" style="display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;">
<div id="qm-activity" class="qm-root">
<style>
#qm-activity{max-width:900px;margin:1.2em auto;font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;color:#fff;box-sizing:border-box}
#qm-activity *{box-sizing:border-box}
#qm-activity [hidden]{display:none!important}
#qm-activity button{font:inherit;cursor:pointer}
#qm-activity .qm-loading{margin:0;padding:18px;text-align:center;color:#555;font-size:14px}

/* Marco del concurso */
#qm-activity .qm-shell{position:relative;overflow:hidden;overflow:clip;border:3px solid #3b5bdb;border-radius:22px;color:#fff;background:radial-gradient(ellipse at 50% -10%,#3b3bd0 0%,#17197a 38%,#070a3d 72%,#030420 100%);box-shadow:0 0 0 2px #050a30,0 0 28px rgba(70,120,255,.55)}

/* Portada */
#qm-activity .qm-hero{position:relative;padding:2.2em 1.3em 2em;text-align:center;background:radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px) 0 0/46px 46px,radial-gradient(circle,rgba(160,200,255,.7) 0 1px,transparent 1.5px) 23px 23px/46px 46px}
#qm-activity .qm-logo{position:relative;display:flex;align-items:center;justify-content:center;width:118px;height:118px;margin:0 auto 10px;border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 28%,#7ab0ff 0%,#2a3fd0 45%,#0a1260 100%);border:4px solid #ffd978;box-shadow:0 0 0 5px #0a1260,0 0 36px rgba(255,200,80,.65),inset 0 0 22px rgba(0,0,0,.45);animation:qmGlow 2.6s ease-in-out infinite}
#qm-activity .qm-logo b{font-size:78px;line-height:1;font-weight:900;color:#fff!important;text-shadow:0 3px 0 #0a1260,0 0 16px rgba(255,255,255,.6)}
#qm-activity .qm-kick{display:inline-block;margin:0 0 8px;padding:5px 18px;border:1px solid rgba(255,214,120,.8);border-radius:999px;background:rgba(255,200,61,.12);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#ffe08a!important}
#qm-activity .qm-title{margin:2px 0 4px;padding:0;border:0;font-size:46px;font-weight:900;line-height:1.1;color:#ffe08a!important;background:linear-gradient(180deg,#fff7d6 0%,#ffd45e 45%,#ff9d00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,40,.7))}
#qm-activity .qm-sub{max-width:36em;margin:6px auto 16px;font-size:17px;color:#dbe8ff!important}
#qm-activity .qm-rules{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
#qm-activity .qm-rule{padding:5px 15px;border:1px solid rgba(111,168,255,.7);border-radius:999px;background:rgba(20,38,127,.7);font-size:14.5px;color:#fff!important}
#qm-activity .qm-play{display:inline-block;padding:13px 35px;border:3px solid #ffe9a8;border-radius:999px;background:linear-gradient(180deg,#ffd45e,#ff8a00);box-shadow:0 6px 0 #a85a00,0 0 26px rgba(255,170,0,.6);font-size:20px;font-weight:900;color:#2a1700!important;animation:qmPulse 2s ease-in-out infinite}
#qm-activity .qm-play:hover{filter:brightness(1.1)}
#qm-activity .qm-play:active{transform:translateY(3px);box-shadow:0 3px 0 #a85a00}
#qm-activity .qm-credit{margin:24px 0 0;font-size:13.5px;color:#b9cdf5!important}
#qm-activity .qm-credit a{color:#ffe08a!important;font-weight:800;text-decoration:underline}
#qm-activity .qm-credit a:hover{color:#fff!important}

/* Barra superior */
#qm-activity .qm-bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 11px;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(180deg,rgba(5,10,48,.97),rgba(13,27,110,.95));border-bottom:2px solid #3b5bdb;box-shadow:0 6px 16px rgba(0,0,20,.55)}
#qm-activity .qm-brand{font-size:14.5px;font-weight:900;letter-spacing:.02em;color:#ffe08a!important}
#qm-activity .qm-prize{display:inline-flex;align-items:center;padding:4px 14px;border:2px solid #ffc83d;border-radius:999px;background:rgba(255,200,61,.14);font-weight:900;white-space:nowrap;color:#ffe08a!important}
#qm-activity .qm-ll{display:flex;gap:7px}
#qm-activity .qm-llc{display:flex;align-items:center;justify-content:center;min-width:48px;height:35px;padding:0 10px;border:2px solid #6fa8ff;border-radius:999px;background:rgba(20,38,127,.9);font-size:13.5px;font-weight:900;color:#fff!important}
#qm-activity .qm-llc.used{opacity:.4;text-decoration:line-through;border-color:#8a8fb5}
#qm-activity .qm-restart{padding:6px 16px;border:2px solid #9db7ff;border-radius:999px;background:transparent;font-size:13px;font-weight:800;color:#cfe0ff!important}
#qm-activity .qm-restart:hover{background:rgba(255,255,255,.12)}
#qm-activity button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#qm-activity .qm-cols{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:16px;align-items:start;padding:16px}
#qm-activity .qm-main{min-width:0}

/* Escalera de premios */
#qm-activity .qm-ladder{position:sticky;top:74px;display:flex;flex-direction:column;gap:3px;padding:8px;border:2px solid #3b5bdb;border-radius:14px;background:rgba(5,10,48,.78)}
#qm-activity .qm-lv{display:flex;justify-content:space-between;gap:10px;margin:0;padding:3px 11px;border-radius:8px;font-size:13.5px;font-weight:800;color:#ff9f1c!important;border:1px solid transparent}
#qm-activity .qm-lv span{color:inherit!important}
#qm-activity .qm-lv.safe{color:#fff!important}
#qm-activity .qm-lv .n{opacity:.85}
#qm-activity .qm-lv.cur{background:#ff8a00;color:#2a1700!important;animation:qmBlink 1.4s ease-in-out infinite}
#qm-activity .qm-lv.still{animation:none}
#qm-activity .qm-lv.done{background:rgba(24,169,87,.28);color:#9dffc4!important}
#qm-activity .qm-lv.bad{background:#d6284a;color:#fff!important}

/* Pregunta */
#qm-activity .qm-fade{animation:qmSlide .45s ease}
#qm-activity .qm-meta{display:flex;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:14.5px;font-weight:800}
#qm-activity .qm-qn{color:#9fc2ff!important}
#qm-activity .qm-qv{color:#ffe08a!important}
#qm-activity .qm-qt{position:relative;margin:0 0 14px;padding:16px 21px;border:3px solid #6fa8ff;border-radius:18px;background:linear-gradient(180deg,#1b2fa0 0%,#0a1260 100%);box-shadow:0 0 20px rgba(70,130,255,.5),inset 0 0 18px rgba(0,0,40,.5);font-size:19px;font-weight:700;line-height:1.35;text-align:center;color:#fff!important}
#qm-activity .qm-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin:0 0 14px}
#qm-activity .qm-tools.qm-off .qm-lf:not(.qm-hintb){pointer-events:none;opacity:.35}
#qm-activity .qm-lf{display:inline-flex;align-items:center;gap:5px;margin:0;padding:6px 16px;border:2px solid #ffc83d;border-radius:999px;background:rgba(255,200,61,.12);font-size:14.5px;font-weight:900;color:#ffe08a!important;transition:background .15s}
#qm-activity .qm-lf:hover{background:rgba(255,200,61,.3)}
#qm-activity .qm-lf.qm-hintb{border-color:#7ee0a0;background:rgba(24,169,87,.15);color:#a8ffcb!important}
#qm-activity .qm-lf.qm-hintb:hover{background:rgba(24,169,87,.32)}
#qm-activity .qm-hintp{flex:1 1 100%;margin:2px 0 0;padding:11px 16px;border-left:5px solid #7ee0a0;border-radius:0 12px 12px 0;background:rgba(24,169,87,.18);color:#e9fff1!important;animation:qmSlide .3s ease}

/* Opciones */
#qm-activity .qm-opts{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 14px}
#qm-activity .qm-opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;margin:0;min-height:58px;padding:11px 21px;border:2px solid #6fa8ff;border-radius:999px;background:linear-gradient(180deg,#14267f 0%,#07104a 100%);box-shadow:0 0 0 1px #050a30,0 0 14px rgba(70,130,255,.4);font-weight:600;text-align:left;color:#fff!important;transition:background .15s,box-shadow .15s}
#qm-activity .qm-opt:hover{background:linear-gradient(180deg,#ffb300,#ff8a00);border-color:#ffe08a;box-shadow:0 0 20px rgba(255,170,0,.65);color:#241400!important}
#qm-activity .qm-opt .qm-l{flex:none;font-weight:900;color:#ffb300!important}
#qm-activity .qm-opt:hover .qm-l{color:#241400!important}
#qm-activity .qm-opt .qm-txt{flex:1;min-width:0;color:inherit!important}
#qm-activity .qm-opt.qm-w{grid-column:1/-1;justify-content:center;min-height:0;padding:7px 19px;border-color:#8a8fb5;background:transparent;box-shadow:none;font-size:14px;color:#cfd6f5!important}
#qm-activity .qm-opt.qm-w .qm-l{color:inherit!important}
#qm-activity .qm-opt.is-gone{visibility:hidden}
#qm-activity .qm-pct{display:none;flex:none;flex-direction:column;gap:2px;width:61px;font-size:13px;font-weight:900;text-align:right;color:#ffe08a!important}
#qm-activity .qm-pct b{color:inherit!important}
#qm-activity .qm-opts.show-pct .qm-pct{display:flex}
#qm-activity .qm-pb{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
#qm-activity .qm-pbi{display:block;height:100%;background:linear-gradient(90deg,#ffd45e,#ff8a00)}
#qm-activity .qm-locked .qm-opt{pointer-events:none}
#qm-activity .qm-opt.is-dim{opacity:.5}
#qm-activity .qm-opt.is-right{opacity:1;border-color:#b6ffd3;background:linear-gradient(180deg,#26c971,#0e7a3f);box-shadow:0 0 24px rgba(40,220,120,.75);color:#fff!important;animation:qmPop .5s ease}
#qm-activity .qm-opt.is-right .qm-l,#qm-activity .qm-opt.is-right .qm-pct{color:#fff!important}
#qm-activity .qm-opt.is-wrong{opacity:1;border-color:#ffc0cc;background:linear-gradient(180deg,#e0405f,#8c1229);box-shadow:0 0 24px rgba(230,50,90,.75);color:#fff!important;animation:qmShake .5s ease}
#qm-activity .qm-opt.is-wrong .qm-l{color:#fff!important}

/* Retroalimentación */
#qm-activity .qm-fb{margin-top:14px;padding:15px 19px;border-radius:16px}
#qm-activity .qm-fb--ok{border:2px solid #7dffb0;background:rgba(24,169,87,.22);color:#eafff2!important}
#qm-activity .qm-fb--bad{border:2px solid #ff9bb0;background:rgba(214,40,74,.25);color:#fff0f3!important}
#qm-activity .qm-fb p{margin:0 0 4px;color:inherit!important}
#qm-activity .qm-fb .qm-fb-h{margin:0 0 5px;font-size:17.5px;font-weight:900}
#qm-activity .qm-fb--ok .qm-fb-h{color:#9dffc4!important}
#qm-activity .qm-fb--bad .qm-fb-h{color:#ffc3cf!important}
#qm-activity .qm-fb .qm-fb-right{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.55)}
#qm-activity .qm-fb strong{color:inherit!important}

/* Siguiente y finales */
#qm-activity .qm-nextrow{margin-top:16px;text-align:center}
#qm-activity .qm-next{display:inline-flex;align-items:center;gap:6px;margin:0;padding:11px 29px;border:3px solid #ffe9a8;border-radius:999px;background:linear-gradient(180deg,#ffd45e,#ff8a00);box-shadow:0 5px 0 #a85a00,0 0 20px rgba(255,170,0,.55);font-size:17.5px;font-weight:900;color:#2a1700!important;animation:qmPulse 1.8s ease-in-out infinite}
#qm-activity .qm-next:hover{filter:brightness(1.1)}
#qm-activity .qm-end{margin-top:18px;padding:19px 21px;border-radius:18px;text-align:center;animation:qmSlide .5s ease}
#qm-activity .qm-end--over{border:3px solid #ff9bb0;background:linear-gradient(180deg,rgba(140,18,41,.55),rgba(60,5,20,.6))}
#qm-activity .qm-end--walk{border:3px solid #ffc83d;background:linear-gradient(180deg,rgba(168,90,0,.5),rgba(70,35,0,.6))}
#qm-activity .qm-end--win{border:4px solid #ffe08a;background:linear-gradient(180deg,rgba(24,169,87,.5),rgba(5,60,40,.7));box-shadow:0 0 34px rgba(255,214,90,.7)}
#qm-activity .qm-end p{margin:6px 0;color:#fff!important}
#qm-activity .qm-end .qm-end-t{margin:0 0 5px;font-size:24px;font-weight:900;color:#ffe08a!important}
#qm-activity .qm-end .qm-end-a{margin:3px 0;font-size:19px;font-weight:900;color:#fff!important}
#qm-activity .qm-end strong{color:#ffe08a!important}
#qm-activity .qm-btn{margin-top:11px;padding:10px 29px;border:3px solid #ffe9a8;border-radius:999px;background:linear-gradient(180deg,#ffd45e,#ff8a00);box-shadow:0 5px 0 #a85a00;font-weight:900;color:#2a1700!important}
#qm-activity .qm-btn:hover{filter:brightness(1.1)}
#qm-activity .qm-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a85a00}

/* Confeti */
#qm-activity .qm-confetti{position:absolute;left:0;right:0;top:0;bottom:0;z-index:40;overflow:hidden;pointer-events:none}
#qm-activity .qm-cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:qmFall linear infinite}

@keyframes qmPop{0%{transform:scale(.97)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes qmShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes qmSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes qmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes qmBlink{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes qmGlow{0%,100%{box-shadow:0 0 0 5px #0a1260,0 0 26px rgba(255,200,80,.5),inset 0 0 22px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 5px #0a1260,0 0 48px rgba(255,200,80,.95),inset 0 0 22px rgba(0,0,0,.45)}}
@keyframes qmFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(900px) rotate(700deg);opacity:1}}

/* Adaptación al ancho real del contenedor (data-size lo calcula el script) */
#qm-activity[data-size="s"] .qm-cols,#qm-activity[data-size="xs"] .qm-cols{grid-template-columns:1fr;padding:12px}
#qm-activity[data-size="s"] .qm-ladder,#qm-activity[data-size="xs"] .qm-ladder{position:static;order:-1;flex-direction:row-reverse;flex-wrap:wrap-reverse;justify-content:center;gap:4px;padding:7px}
#qm-activity[data-size="s"] .qm-lv,#qm-activity[data-size="xs"] .qm-lv{width:35px;height:35px;padding:0;justify-content:center;align-items:center;border-radius:50%;border:1px solid rgba(255,159,28,.6);font-size:13px}
#qm-activity[data-size="s"] .qm-lv.safe,#qm-activity[data-size="xs"] .qm-lv.safe{border-color:#fff}
#qm-activity[data-size="s"] .qm-lv .a,#qm-activity[data-size="xs"] .qm-lv .a{display:none}
#qm-activity[data-size="s"] .qm-lv .n,#qm-activity[data-size="xs"] .qm-lv .n{opacity:1}
#qm-activity[data-size="s"] .qm-opts,#qm-activity[data-size="xs"] .qm-opts{grid-template-columns:1fr}
#qm-activity[data-size="s"] .qm-qt,#qm-activity[data-size="xs"] .qm-qt{font-size:17px}
#qm-activity[data-size="s"] .qm-brand,#qm-activity[data-size="xs"] .qm-brand{display:none}
#qm-activity[data-size="s"] .qm-title{font-size:36px}
#qm-activity[data-size="xs"] .qm-title{font-size:28px}
#qm-activity[data-size="xs"] .qm-hero{padding:26px 14px 24px}
#qm-activity[data-size="xs"] .qm-logo{width:96px;height:96px}
#qm-activity[data-size="xs"] .qm-logo b{font-size:62px}
#qm-activity[data-size="xs"] .qm-opt{padding:10px 16px}
#qm-activity[data-size="xs"] .qm-end .qm-end-t{font-size:20px}

@media (prefers-reduced-motion:reduce){#qm-activity *{animation:none!important;transition:none!important}#qm-activity .qm-confetti{display:none!important}}
</style>

        fb = el('div', 'qm-fb qm-fade ' + (f.k ? 'qm-fb--ok' : 'qm-fb--bad')); fb.setAttribute('aria-live', 'polite');
        fb.appendChild(el('p', 'qm-fb-h', f.h));
        if (f.b) { fb.appendChild(el('p', '', f.b)); }
        if (!f.k) {
          p = el('p', 'qm-fb-right'); p.appendChild(el('strong', '', 'Respuesta correcta:')); p.appendChild(document.createTextNode(' ' + f.r));
          fb.appendChild(p);
        }
        fbBox.appendChild(fb);
        if (f.k) {
          cleared = num; hud(); paint(0, false);
          if (num === N) { paint(0, true); end('win'); confetti(); }
          else {
            var nx = el('button', 'qm-next', 'Siguiente pregunta \u279C'); nx.type = 'button';
            nx.addEventListener('click', function () { qi++; showQuestion(); });
            nextRow.appendChild(nx);
          }
        } else {
          paint(num, true); end('over');
        }
        if (f.k) { if (fb.scrollIntoView) { try { fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (err2) { } } }
      }
      function walk() {
        if (answered) { return; }
        answered = true; lockAll();
        var j;
        for (j = 0; j !== 4; j++) { btns[j].className += ' is-dim'; }
        wb.className += ' is-dim';
        paint(0, true);
        end('walk');
      }
      function makePick(idx) { return function () { choose(idx); }; }
      for (k = 0; k !== 4; k++) { btns[k].addEventListener('click', makePick(k)); }
      if (wb) { wb.addEventListener('click', walk); }
      if (b50) {
        b50.addEventListener('click', function () {
          var j;
          if (answered) { return; }
          used50 = true; hud();
          for (j = 0; j !== 4; j++) { if (d.o[j].r) { btns[j].className += ' is-gone'; btns[j].setAttribute('aria-hidden', 'true'); } }
          b50.hidden = true;
        });
      }
      if (bPub) {
        bPub.addEventListener('click', function () {
          if (answered) { return; }
          usedPub = true; hud();
          opts.className = opts.className + ' show-pct';
          bPub.hidden = true;
        });
      }
      bHint.addEventListener('click', function () {
        hintP.hidden = !hintP.hidden;
        bHint.setAttribute('aria-expanded', hintP.hidden ? 'false' : 'true');
      });
      ui.pick = function (idx) { if (!btns[idx].className.match('is-gone')) { choose(idx); } };
    }

    root.addEventListener('keydown', function (e) {
      var idx;
      if (!inGame) { return; }
      if (answered) { return; }
      if (!e.key) { return; }
      idx = LET.indexOf(e.key.toUpperCase());
      if (e.key.length === 1) { if (idx !== -1) { if (ui.pick) { ui.pick(idx); } } }
    });

    intro();
  }

  /* ---------- arranque tolerante a eXeLearning ---------- */
  function boot() {
    var roots = document.querySelectorAll('.qm-root'), i;
    for (i = 0; i !== roots.length; i++) {
      try { build(roots[i]); } catch (err) {
        roots[i].appendChild(el('p', 'qm-loading', 'Error al cargar la actividad: ' + err.message));
      }
    }
  }
  boot();
  if (document.addEventListener) {
    document.addEventListener('DOMContentLoaded', boot);
    window.addEventListener('load', boot);
  }
  setTimeout(boot, 400);
  setTimeout(boot, 1500);
})();
</script>
</div>
</div>

<script>
/* Si esta página va dentro de un iframe, avisa a la página que la contiene de la altura que necesita
   (solo tiene efecto si esa página tiene un receptor; si no, no hace nada). */
(function () {
  if (window.parent === window) { return; }
  var ultimo = -1;
  function enviar() {
    var h = document.body.offsetHeight;
    if (h && h !== ultimo) {
      ultimo = h;
      try { window.parent.postMessage({ tipo: "rd-alto", alto: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("load", enviar);
  window.addEventListener("resize", enviar);
  if (window.ResizeObserver) { new window.ResizeObserver(enviar).observe(document.body); }
  else { window.setInterval(enviar, 500); }
})();
</script>
