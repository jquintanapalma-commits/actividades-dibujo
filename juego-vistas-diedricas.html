<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego de vistas diédricas</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{padding:12px 10px 28px}
</style>
</head>
<body>
<div class="jvd-embed-wrap" style="display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;">
<div id="jvd-activity" class="jvd-root">
<style>
#jvd-activity{--wine:#8e1732;--wine-d:#5c0f22;--wine2:#aa364b;--ink:#292522;--line:#d9bfb4;--muted:#6d6258;--green:#2f7359;--red:#a52c37;--amber:#e29b35;font-family:Arial,Helvetica,sans-serif;color:var(--ink);width:100%;min-width:0;max-width:1180px;margin:0 auto;font-size:16px;line-height:1.4;box-sizing:border-box}
#jvd-activity *{box-sizing:border-box}
#jvd-activity button{font:inherit;cursor:pointer}
#jvd-activity .jvd-loading{margin:0;padding:18px;text-align:center;color:#6d6258;font-size:14px}

/* Estructura general */
#jvd-activity .jvd-shell{position:relative;background-color:#fbf5dc;background-image:linear-gradient(rgba(142,23,50,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(142,23,50,.05) 1px,transparent 1px);background-size:24px 24px;border:1px solid #d8c9ac;border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(60,25,30,.2)}
#jvd-activity .jvd-header{position:relative;display:flex;align-items:center;gap:16px;padding:16px 24px;color:#fff;background:linear-gradient(120deg,#5c0f22 0%,#8e1732 55%,#aa364b 100%);border-bottom:5px solid var(--amber)}
#jvd-activity .jvd-header:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0,rgba(255,255,255,.07) 2px,transparent 2px,transparent 14px);pointer-events:none}
#jvd-activity .jvd-logo,#jvd-activity .jvd-head-text,#jvd-activity .jvd-badge{position:relative;z-index:1}
#jvd-activity .jvd-logo{width:56px;height:56px;border-radius:15px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;flex:none}
#jvd-activity .jvd-head-text{flex:1;min-width:0}
#jvd-activity .jvd-title{font-size:28px;font-weight:800;letter-spacing:.04em;margin:0;text-transform:uppercase;color:#fff;line-height:1.15}
#jvd-activity .jvd-subtitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-top:3px}
#jvd-activity .jvd-badge{white-space:nowrap;background:var(--amber);color:#4a1220;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:.07em;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#jvd-activity .jvd-main{padding:22px 24px 18px}

/* Animaciones */
@keyframes jvdFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes jvdFloat{0%{transform:translateY(0)}50%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes jvdShake{0%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes jvdPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes jvdGlow{0%{box-shadow:0 4px 0 #5c0f22,0 0 0 0 rgba(226,155,53,.55)}70%{box-shadow:0 4px 0 #5c0f22,0 0 0 12px rgba(226,155,53,0)}100%{box-shadow:0 4px 0 #5c0f22,0 0 0 0 rgba(226,155,53,0)}}
@keyframes jvdFall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(520px) rotate(540deg);opacity:0}}
#jvd-activity .jvd-fade{animation:jvdFade .45s ease both}

/* Botones */
#jvd-activity .jvd-primary{border:0;background:linear-gradient(180deg,#a52b47,#8e1732);color:#fff;border-radius:12px;padding:13px 22px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #5c0f22;transition:transform .12s,box-shadow .12s,filter .12s}
#jvd-activity .jvd-primary:hover{filter:brightness(1.1);transform:translateY(-2px)}
#jvd-activity .jvd-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #5c0f22}
#jvd-activity .jvd-start{margin-top:20px;animation:jvdGlow 2.2s infinite}
#jvd-activity .jvd-primary:focus-visible,#jvd-activity .jvd-option:focus-visible,#jvd-activity .jvd-secondary:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
#jvd-activity .jvd-secondary{border:1px solid #ad8b86;border-radius:999px;background:#fff;color:var(--wine);padding:7px 14px;font-weight:700;font-size:12px;transition:background .12s}
#jvd-activity .jvd-secondary:hover{background:#f6e3da}

/* Portada */
#jvd-activity .jvd-intro{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.4fr);gap:28px;align-items:center;min-height:380px}
#jvd-activity .jvd-intro-art{position:relative;border:1px solid var(--line);border-radius:20px;min-height:310px;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#fffdf6;background-image:radial-gradient(#e2cfc0 .8px,transparent .8px);background-size:14px 14px;box-shadow:inset 0 0 0 6px #fff,0 6px 16px rgba(92,15,34,.12)}
#jvd-activity .jvd-intro-art svg{animation:jvdFloat 5s ease-in-out infinite;max-height:310px}
#jvd-activity .jvd-kicker{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--wine);border-radius:999px;padding:4px 12px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px}
#jvd-activity .jvd-h2{font-size:34px;line-height:1.12;margin:0 0 14px;color:var(--wine);font-weight:800}
#jvd-activity .jvd-intro-copy p{margin:9px 0;color:#413832;max-width:680px}
#jvd-activity .jvd-info-note{margin-top:16px;padding:13px 16px;border-left:5px solid var(--amber);background:#fff3dc;border-radius:0 12px 12px 0;font-size:14px;color:#4a3b2c}
#jvd-activity .jvd-legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0}
#jvd-activity .jvd-chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px 5px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;background:#fff;border:1px solid var(--line)}
#jvd-activity .jvd-dot{width:14px;height:14px;border-radius:4px;border:2px solid}
#jvd-activity .jvd-dot-alz{background:#f9dde2;border-color:#8e1732}
#jvd-activity .jvd-dot-per{background:#d3ebee;border-color:#1f6f78}
#jvd-activity .jvd-dot-pla{background:#fbe8c4;border-color:#b9731a}

/* Pantalla de juego */
#jvd-activity .jvd-game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#jvd-activity .jvd-piece-label{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#fff;background:var(--wine);border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 var(--wine-d)}
#jvd-activity .jvd-progress{display:flex;align-items:center;gap:6px}
#jvd-activity .jvd-step{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#f1e8d6;color:#8a7a68;border:2px solid #d3c3aa;flex:none}
#jvd-activity .jvd-step.done{background:var(--green);border-color:var(--green);color:#fff}
#jvd-activity .jvd-step.current{background:var(--wine);border-color:var(--amber);color:#fff;box-shadow:0 0 0 4px rgba(226,155,53,.35)}
#jvd-activity .jvd-sep{width:20px;height:4px;border-radius:4px;background:#d3c3aa}
#jvd-activity .jvd-sep.done{background:var(--green)}
#jvd-activity .jvd-prompt{font-size:16px;margin:0 0 14px;color:#3b312b}
#jvd-activity .jvd-board{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.6fr);gap:18px;align-items:stretch}
#jvd-activity .jvd-panel{border:1px solid var(--line);border-radius:18px;background:#fffdf8;overflow:hidden;min-width:0;box-shadow:0 6px 16px rgba(92,15,34,.1)}
#jvd-activity .jvd-panel-head{background:linear-gradient(90deg,#f6e6d6,#fbf1e3);border-bottom:1px solid #e3cbbd;padding:11px 15px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:#6e2132}
#jvd-activity .jvd-answers-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
#jvd-activity .jvd-answers-head span{font-weight:normal;letter-spacing:0;text-transform:none;color:#75695f;font-size:11px}
#jvd-activity .jvd-model-area{min-height:300px;padding:10px;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(#e7d9c4 .8px,transparent .8px);background-size:13px 13px}
#jvd-activity .jvd-model-svg{width:100%;max-width:330px;height:auto;max-height:320px;display:block}
#jvd-activity .jvd-small-note{padding:0 15px 14px;font-size:12px;color:var(--muted);text-align:center}
#jvd-activity .jvd-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}
#jvd-activity .jvd-option{display:block;width:100%;min-width:0;min-height:122px;background:#fff;border:2px solid #e6d6cb;border-radius:14px;padding:8px 7px 6px;color:var(--ink);text-align:center;transition:border-color .12s,box-shadow .12s,transform .12s,opacity .2s;position:relative}
#jvd-activity .jvd-option:not(:disabled):hover{border-color:var(--wine);box-shadow:0 8px 16px rgba(93,25,40,.18);transform:translateY(-3px)}
#jvd-activity .jvd-option:disabled{cursor:default}
#jvd-activity .jvd-option-num{display:inline-block;font-size:10px;color:#fff;background:var(--wine2);border-radius:999px;padding:1px 9px;font-weight:800;margin-bottom:5px;letter-spacing:.05em}
#jvd-activity .jvd-option.is-good{border-color:var(--green);background:#eff8f0;box-shadow:0 0 0 3px #9fc9b0;animation:jvdPop .4s ease both}
#jvd-activity .jvd-option.is-bad{border-color:var(--red);background:#fff0ee;box-shadow:0 0 0 3px #e8b6b6;animation:jvdShake .45s ease both}
#jvd-activity .jvd-option.is-dim{opacity:.5}
#jvd-activity .jvd-view-set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:'front side' 'top blank';align-items:center;gap:1px 6px;max-width:132px;margin:0 auto}
#jvd-activity .jvd-view-alz{grid-area:front}
#jvd-activity .jvd-view-per{grid-area:side}
#jvd-activity .jvd-view-pla{grid-area:top}
#jvd-activity .jvd-view{width:100%;height:auto;display:block;overflow:visible}
#jvd-activity .jvd-view-label{font-size:7px;letter-spacing:.03em;font-weight:800}
#jvd-activity .jvd-view-alz .jvd-view-label{fill:#8e1732}
#jvd-activity .jvd-view-per .jvd-view-label{fill:#1f6f78}
#jvd-activity .jvd-view-pla .jvd-view-label{fill:#a2640f}
#jvd-activity .jvd-answer-foot{font-size:11px;color:#77695e;text-align:center;padding:0 12px 12px}
#jvd-activity .jvd-bottomline{border-top:2px dashed #d6c1ae;margin-top:16px;padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:#6f6258;font-size:12px}

/* Retroalimentación */
#jvd-activity .jvd-overlay{margin:16px 0 0;padding:15px 18px;border:1px solid #91b5a1;border-left:6px solid var(--green);border-radius:14px;background:#eff8f0;display:flex;align-items:center;gap:14px;box-shadow:0 6px 14px rgba(47,115,89,.15)}
#jvd-activity .jvd-overlay.error{border-color:#d39b9e;border-left-color:var(--red);background:#fff0ee;box-shadow:0 6px 14px rgba(165,44,55,.15)}
#jvd-activity .jvd-fb-icon{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
#jvd-activity .jvd-overlay.error .jvd-fb-icon{background:var(--red)}
#jvd-activity .jvd-fb-text{flex:1;min-width:0}
#jvd-activity .jvd-feedback-title{font-weight:800;margin:0 0 3px;font-size:17px;color:var(--green)}
#jvd-activity .jvd-overlay.error .jvd-feedback-title{color:var(--red)}
#jvd-activity .jvd-feedback-copy{font-size:13px;margin:0;color:#4a403a}

/* Pantalla final */
#jvd-activity .jvd-finish{position:relative;max-width:800px;margin:0 auto;text-align:center;padding:14px 15px 24px}
#jvd-activity .jvd-finish-mark{width:104px;height:104px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle,#fff7e4,#f1dfc3);border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;animation:jvdPop .6s ease both;box-shadow:0 8px 20px rgba(226,155,53,.4)}
#jvd-activity .jvd-finish p{margin:8px 0;color:#413832}
#jvd-activity .jvd-ticket{display:inline-block;max-width:100%;margin:14px auto;padding:6px;border-radius:18px;background:linear-gradient(135deg,var(--amber),#f6cf8a,var(--amber))}
#jvd-activity .jvd-ticket-in{border:2px dashed #b7727c;border-radius:13px;background:#fffaf0;padding:14px 22px 16px}
#jvd-activity .jvd-ticket-label{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.2em;color:#8a7a68;text-transform:uppercase}
#jvd-activity .jvd-password{font-size:26px;font-weight:900;color:var(--wine);overflow-wrap:anywhere;line-height:1.3}
#jvd-activity .jvd-confetti{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none;z-index:5}
#jvd-activity .jvd-confetti span{position:absolute;top:0;width:10px;height:16px;border-radius:2px;opacity:0;animation:jvdFall 3s ease-in forwards}

/* Adaptación al ancho real del contenedor (data-size lo calcula el script) */
#jvd-activity .jvd-intro-art svg,#jvd-activity .jvd-model-svg{max-width:100%}
#jvd-activity[data-size="m"] .jvd-main{padding:18px}
#jvd-activity[data-size="m"] .jvd-header{padding:14px 18px;gap:12px}
#jvd-activity[data-size="m"] .jvd-logo{width:48px;height:48px}
#jvd-activity[data-size="m"] .jvd-title{font-size:24px}
#jvd-activity[data-size="m"] .jvd-intro{grid-template-columns:minmax(230px,.85fr) minmax(0,1.3fr);gap:20px;min-height:330px}
#jvd-activity[data-size="m"] .jvd-intro-art{min-height:270px}
#jvd-activity[data-size="m"] .jvd-h2{font-size:28px}
#jvd-activity[data-size="m"] .jvd-board{grid-template-columns:minmax(230px,.72fr) minmax(0,1.6fr);gap:14px}
#jvd-activity[data-size="m"] .jvd-model-area{min-height:250px}
#jvd-activity[data-size="m"] .jvd-options{gap:8px;padding:9px}
#jvd-activity[data-size="m"] .jvd-option{min-height:108px;padding:6px 4px 5px}
#jvd-activity[data-size="m"] .jvd-view-set{max-width:112px}

#jvd-activity[data-size="s"] .jvd-main,#jvd-activity[data-size="xs"] .jvd-main{padding:14px}
#jvd-activity[data-size="s"] .jvd-header,#jvd-activity[data-size="xs"] .jvd-header{padding:12px 14px;gap:10px}
#jvd-activity[data-size="s"] .jvd-logo,#jvd-activity[data-size="xs"] .jvd-logo{width:42px;height:42px}
#jvd-activity[data-size="s"] .jvd-title{font-size:22px}
#jvd-activity[data-size="s"] .jvd-badge,#jvd-activity[data-size="xs"] .jvd-badge{font-size:10px;padding:5px 9px}
#jvd-activity[data-size="s"] .jvd-intro,#jvd-activity[data-size="xs"] .jvd-intro{grid-template-columns:1fr;gap:14px;min-height:0}
#jvd-activity[data-size="s"] .jvd-intro-art,#jvd-activity[data-size="xs"] .jvd-intro-art{min-height:230px}
#jvd-activity[data-size="s"] .jvd-intro-art svg,#jvd-activity[data-size="xs"] .jvd-intro-art svg{max-height:230px}
#jvd-activity[data-size="s"] .jvd-h2,#jvd-activity[data-size="xs"] .jvd-h2{font-size:25px}
#jvd-activity[data-size="s"] .jvd-board,#jvd-activity[data-size="xs"] .jvd-board{grid-template-columns:1fr;gap:14px}
#jvd-activity[data-size="s"] .jvd-model-area,#jvd-activity[data-size="xs"] .jvd-model-area{min-height:220px}
#jvd-activity[data-size="s"] .jvd-model-svg,#jvd-activity[data-size="xs"] .jvd-model-svg{max-height:240px}
#jvd-activity[data-size="s"] .jvd-options,#jvd-activity[data-size="xs"] .jvd-options{gap:8px;padding:9px}
#jvd-activity[data-size="s"] .jvd-option{min-height:108px}
#jvd-activity[data-size="s"] .jvd-overlay,#jvd-activity[data-size="xs"] .jvd-overlay{flex-wrap:wrap}

#jvd-activity[data-size="xs"] .jvd-title{font-size:18px}
#jvd-activity[data-size="xs"] .jvd-subtitle{font-size:10px}
#jvd-activity[data-size="xs"] .jvd-badge{display:none}
#jvd-activity[data-size="xs"] .jvd-options{grid-template-columns:repeat(2,minmax(0,1fr))}
#jvd-activity[data-size="xs"] .jvd-step{width:26px;height:26px;font-size:12px}
#jvd-activity[data-size="xs"] .jvd-sep{width:8px}
#jvd-activity[data-size="xs"] .jvd-password{font-size:20px}

/* Pie */
#jvd-activity .jvd-footnote{font-size:12px;color:#85776c;text-align:center;padding:12px 16px 16px;border-top:1px solid #e5d9c3;background:rgba(255,255,255,.55)}
#jvd-activity .jvd-footnote a{color:var(--wine);font-weight:700}

#jvd-activity .jvd-intro-copy p.jvd-kicker,#jvd-activity .jvd-finish p.jvd-kicker{color:#fff}
#jvd-activity .jvd-board .jvd-panel:first-child{display:flex;flex-direction:column}
#jvd-activity .jvd-board .jvd-panel:first-child .jvd-model-area{flex:1}
#jvd-activity .jvd-finish .jvd-primary{margin-top:10px}

@media (prefers-reduced-motion:reduce){#jvd-activity *{animation:none!important;transition:none!important}}
</style>
<p class="jvd-loading">Cargando la actividad… Si este mensaje no desaparece, abre la Vista previa de eXeLearning o exporta el contenido: los scripts no se ejecutan en todas las vistas del editor.</p>
