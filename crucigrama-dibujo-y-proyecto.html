<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crucigrama del proyecto</title>
<style>
html,body{margin:0;padding:0;background:transparent}
body{padding:12px 10px 28px}
</style>
</head>
<body>
<div class="cw-embed-wrap" style="display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;">
<div id="cw-activity" class="cw-root">
<style>
#cw-activity{--cs:36px;font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;color:#fff;width:100%;min-width:0;max-width:1180px;margin:0 auto;font-size:16px;line-height:1.45;box-sizing:border-box}
#cw-activity *{box-sizing:border-box}
#cw-activity [hidden]{display:none!important}
#cw-activity button{font:inherit;cursor:pointer}
#cw-activity .cw-loading{margin:0;padding:18px;text-align:center;color:#555;font-size:14px}

/* Marco: papel de plano azul con cuadrícula */
#cw-activity .cw-shell{position:relative;overflow:hidden;border-radius:24px;border:2px solid #2d62c9;box-shadow:0 14px 38px rgba(4,20,60,.5);background-color:#0b3a96;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),radial-gradient(circle at 18% 0%,#2a6ee0,transparent 55%),linear-gradient(160deg,#0a2d78,#0d3f9f 55%,#08245f);background-size:120px 120px,120px 120px,24px 24px,24px 24px,100% 100%,100% 100%}
#cw-activity .cw-header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:4px double rgba(255,255,255,.55);background:rgba(4,22,64,.35)}
#cw-activity .cw-logo{flex:none;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#ffd23f;box-shadow:0 4px 0 #b88f00}
#cw-activity .cw-head-text{flex:1;min-width:0}
#cw-activity .cw-title{margin:0;padding:0;border:0;font-size:27px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;color:#fff!important;background:none}
#cw-activity .cw-subtitle{margin-top:4px;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#bfe3ff!important}
#cw-activity .cw-block{flex:none;display:grid;grid-template-columns:auto auto;border:1.5px solid rgba(255,255,255,.75);font-family:"Courier New",monospace;font-size:11px;letter-spacing:.05em;color:#fff}
#cw-activity .cw-block span{padding:3px 9px;border-right:1px solid rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.5);color:#fff!important}
#cw-activity .cw-block .cw-bk{color:#9fd3ff!important;background:rgba(255,255,255,.08)}
#cw-activity .cw-main{padding:20px 22px 16px}

/* Animaciones */
@keyframes cwFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cwDraw{to{stroke-dashoffset:0}}
@keyframes cwShake{0%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
@keyframes cwPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes cwPulse{0%{box-shadow:0 5px 0 #b86a00,0 0 0 0 rgba(255,159,28,.65)}70%{box-shadow:0 5px 0 #b86a00,0 0 0 16px rgba(255,159,28,0)}100%{box-shadow:0 5px 0 #b86a00,0 0 0 0 rgba(255,159,28,0)}}
@keyframes cwBob{0%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}100%{transform:translateY(0) rotate(-3deg)}}
@keyframes cwRise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-34px);opacity:0}}
@keyframes cwFall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(680px) rotate(600deg);opacity:0}}
@keyframes cwStamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}60%{transform:rotate(-12deg) scale(.92);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:1}}
#cw-activity .cw-fade{animation:cwFade .5s ease both}
#cw-activity .cw-draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:cwDraw 2.6s ease forwards}

/* Botones */
#cw-activity .cw-primary{border:0;border-radius:999px;padding:13px 28px;font-size:17px;font-weight:900;color:#3b2200!important;background:linear-gradient(180deg,#ffc15e,#ff9f1c);box-shadow:0 5px 0 #b86a00;transition:transform .12s,filter .12s}
#cw-activity .cw-primary:hover{filter:brightness(1.08);transform:translateY(-2px)}
#cw-activity .cw-primary:active{transform:translateY(4px);box-shadow:0 1px 0 #b86a00}
#cw-activity .cw-start{margin-top:18px;animation:cwPulse 2.2s infinite}
#cw-activity .cw-btn{border:1.5px solid rgba(255,255,255,.75);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:800;color:#fff!important;background:rgba(255,255,255,.12);transition:background .12s,transform .12s}
#cw-activity .cw-btn:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
#cw-activity .cw-btn:disabled{opacity:.4;cursor:default;transform:none}
#cw-activity .cw-btn-hint{border-color:#ffd23f;background:rgba(255,210,63,.18);color:#ffe58a!important}
#cw-activity .cw-btn-ok{border-color:#35d07f;background:rgba(53,208,127,.2);color:#bdf5d6!important}
#cw-activity .cw-btn-give{border-color:#ff8a9a;background:rgba(255,93,115,.2);color:#ffd0d6!important}
#cw-activity button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}

/* Portada */
#cw-activity .cw-hero{display:grid;grid-template-columns:minmax(260px,.95fr) minmax(0,1.25fr);gap:26px;align-items:center;min-height:380px}
#cw-activity .cw-art{border-radius:20px;padding:10px;background:rgba(4,22,64,.4);border:1.5px dashed rgba(255,255,255,.5)}
#cw-activity .cw-art svg{display:block;width:100%;height:auto}
#cw-activity .cw-kicker{display:inline-block;margin:0 0 10px;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#3b2200!important;background:#ffd23f}
#cw-activity .cw-h2{margin:0 0 10px;padding:0;border:0;font-size:34px;line-height:1.12;font-weight:900;color:#fff!important;background:none;text-shadow:0 3px 0 rgba(4,22,64,.5)}
#cw-activity .cw-text{margin:8px 0;color:#e6f1ff!important;max-width:660px}
#cw-activity .cw-facts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
#cw-activity .cw-fact{min-width:104px;padding:9px 14px;border-radius:14px;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
#cw-activity .cw-fact b{display:block;font-size:26px;line-height:1.1;color:#ffd23f!important}
#cw-activity .cw-fact span{font-size:12px;color:#dcebff!important}
#cw-activity .cw-steps{display:grid;gap:8px;margin:14px 0 0;max-width:660px}
#cw-activity .cw-step{display:flex;align-items:center;gap:12px;padding:8px 13px;border-radius:13px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
#cw-activity .cw-step .cw-sn{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#3b2200!important;background:#ffd23f}
#cw-activity .cw-step .cw-st{color:#fff!important;font-size:15px}
#cw-activity .cw-rules{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
#cw-activity .cw-rule{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;color:#fff!important;background:rgba(4,22,64,.45);border:1px solid rgba(255,255,255,.35)}

/* HUD y progreso */
#cw-activity .cw-hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#cw-activity .cw-ruler{flex:1;min-width:170px}
#cw-activity .cw-ruler-top{display:flex;justify-content:space-between;font-family:"Courier New",monospace;font-size:12px;letter-spacing:.06em;color:#bfe3ff!important;margin-bottom:3px}
#cw-activity .cw-ruler-track{position:relative;height:18px;border-radius:5px;background:#f6f9ff;border:2px solid #fff;overflow:hidden}
#cw-activity .cw-ruler-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#35d07f,#7ee8a8);transition:width .5s ease}
#cw-activity .cw-ruler-ticks{position:absolute;left:0;right:0;top:0;bottom:0;background-image:repeating-linear-gradient(90deg,#0b2a63 0,#0b2a63 1.5px,transparent 1.5px,transparent 10px);opacity:.55;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 45%,transparent 45%);mask-image:linear-gradient(180deg,#000 0,#000 45%,transparent 45%)}
#cw-activity .cw-chip{position:relative;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:900;white-space:nowrap;color:#fff!important;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4)}
#cw-activity .cw-chip-pts{color:#ffe58a!important;border-color:#ffd23f}
#cw-activity .cw-chip-streak{color:#ffc4a1!important;border-color:#ff9f1c}
#cw-activity .cw-float{position:absolute;right:8px;top:-8px;font-weight:900;color:#7ee8a8!important;text-shadow:0 0 8px rgba(53,208,127,.9);animation:cwRise 1.3s ease-out forwards;pointer-events:none}

/* Definición activa */
#cw-activity .cw-active{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border-radius:18px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);border-left:8px solid #ffd23f}
#cw-activity .cw-active-text{flex:1;min-width:220px}
#cw-activity .cw-anum{margin:0 0 2px;font-family:"Courier New",monospace;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffe58a!important}
#cw-activity .cw-aclue{margin:0;font-size:17px;font-weight:700;color:#fff!important}
#cw-activity .cw-active-btns{display:flex;flex-wrap:wrap;gap:8px}

/* Rejilla y definiciones */
#cw-activity .cw-layout{display:grid;grid-template-columns:auto minmax(250px,1fr);gap:16px;align-items:start}
#cw-activity .cw-card{min-width:0;border-radius:20px;background:rgba(4,22,64,.38);border:1.5px solid rgba(255,255,255,.3);box-shadow:0 8px 22px rgba(3,16,50,.35)}
#cw-activity .cw-gridcard{padding:12px;overflow-x:auto}
#cw-activity .cw-grid{display:grid;gap:2px}
#cw-activity .cw-blank{width:var(--cs);height:var(--cs)}
#cw-activity .cw-cell{position:relative;width:var(--cs);height:var(--cs);border-radius:5px;background:#f6f9ff;border:1px solid #7aa2ee}
#cw-activity .cw-cell.is-word{background:#fff2a8;border-color:#e0b72c}
#cw-activity .cw-cell.is-solved{background:#c9f6de;border-color:#35d07f}
#cw-activity .cw-cell.is-bad{background:#ffd6dc;border-color:#ff5d73;animation:cwShake .4s ease}
#cw-activity .cw-cell.is-cur{background:#ffd23f;border-color:#ff9f1c;box-shadow:0 0 0 3px #ff9f1c,0 0 14px rgba(255,159,28,.8);z-index:2}
#cw-activity .cw-cell.is-pop{animation:cwPop .45s ease}
#cw-activity .cw-in{display:block;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:5px;background:transparent!important;box-shadow:none;outline:none;text-align:center;text-transform:uppercase;font-family:"Trebuchet MS",Arial,sans-serif;font-weight:900;font-size:calc(var(--cs) * .55);line-height:1;color:#0b2a63!important;caret-color:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
#cw-activity .cw-cell.is-solved .cw-in{color:#0a7a45!important}
#cw-activity .cw-num{position:absolute;left:3px;top:1px;font-family:Arial,sans-serif;font-size:9px;font-weight:800;line-height:1;color:#2f56a8!important;pointer-events:none}
#cw-activity .cw-cluecard{padding:12px;max-height:calc(var(--cs) * 15 + 40px);overflow-y:auto}
#cw-activity .cw-cluehead{margin:2px 0 8px;font-family:"Courier New",monospace;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ffe58a!important}
#cw-activity .cw-clue{display:flex;gap:9px;align-items:flex-start;width:100%;margin:0 0 6px;padding:7px 10px;text-align:left;border-radius:12px;color:#fff!important;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);transition:background .15s,border-color .15s}
#cw-activity .cw-clue:hover{background:rgba(255,255,255,.18)}
#cw-activity .cw-clue.is-active{background:rgba(255,210,63,.25);border-color:#ffd23f}
#cw-activity .cw-clue.is-solved{background:rgba(53,208,127,.16);border-color:rgba(53,208,127,.7)}
#cw-activity .cw-cn{flex:none;min-width:26px;height:26px;padding:0 4px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#3b2200!important;background:#ffd23f}
#cw-activity .cw-clue.is-solved .cw-cn{background:#35d07f;color:#04301b!important}
#cw-activity .cw-ct{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:#fff!important}
#cw-activity .cw-clue.is-solved .cw-ct{color:#d4f7e4!important}
#cw-activity .cw-cs{flex:none;font-weight:900;color:#7ee8a8!important}

/* Lápiz y mensajes */
#cw-activity .cw-coach{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
#cw-activity .cw-mascot{flex:none;width:84px;animation:cwBob 3.4s ease-in-out infinite}
#cw-activity .cw-mascot svg{display:block;width:84px;height:92px;filter:drop-shadow(0 4px 6px rgba(3,16,50,.5))}
#cw-activity .cw-bubble{position:relative;flex:1;min-width:0;padding:13px 18px;border-radius:18px;background:rgba(246,249,255,.96);border:3px solid #7fd8ff;box-shadow:0 6px 18px rgba(3,16,50,.35)}
#cw-activity .cw-bubble:before{content:"";position:absolute;left:-11px;top:28px;width:16px;height:16px;transform:rotate(45deg);background:#f6f9ff;border-left:3px solid #7fd8ff;border-bottom:3px solid #7fd8ff}
#cw-activity .cw-bubble.cw-hint{border-color:#ffd23f}
#cw-activity .cw-bubble.cw-hint:before{border-color:#ffd23f}
#cw-activity .cw-bubble.cw-good{border-color:#35d07f}
#cw-activity .cw-bubble.cw-good:before{border-color:#35d07f}
#cw-activity .cw-bubble.cw-bad{border-color:#ff5d73}
#cw-activity .cw-bubble.cw-bad:before{border-color:#ff5d73}
#cw-activity .cw-bt{margin:0 0 3px;padding:0;border:0;font-size:18px;font-weight:900;color:#0b2a63!important;background:none}
#cw-activity .cw-bubble.cw-good .cw-bt{color:#0a7a45!important}
#cw-activity .cw-bubble.cw-bad .cw-bt{color:#b3263a!important}
#cw-activity .cw-bubble.cw-hint .cw-bt{color:#8a5a00!important}
#cw-activity .cw-bx{margin:0;font-size:14.5px;color:#1c3566!important}

/* Pantalla final */
#cw-activity .cw-end{position:relative;max-width:820px;margin:0 auto;text-align:center;padding:6px 10px 18px}
#cw-activity .cw-stamp{display:block;width:210px;height:150px;margin:0 auto 4px;animation:cwStamp .8s ease both;transform:rotate(-12deg)}
#cw-activity .cw-stars{display:flex;justify-content:center;gap:8px;margin:2px 0}
#cw-activity .cw-star{font-size:48px;line-height:1;color:rgba(255,255,255,.28)!important;animation:cwPop .5s ease both}
#cw-activity .cw-star.on{color:#ffd23f!important;text-shadow:0 0 18px rgba(255,210,63,.9)}
#cw-activity .cw-rank{margin:2px 0 4px;padding:0;border:0;font-size:31px;font-weight:900;color:#fff!important;background:none;text-shadow:0 3px 0 rgba(4,22,64,.5)}
#cw-activity .cw-bigscore{font-size:42px;font-weight:900;color:#ffd23f!important;text-shadow:0 0 20px rgba(255,210,63,.6)}
#cw-activity .cw-bigscore small{font-size:16px;color:#dcebff!important;text-shadow:none}
#cw-activity .cw-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
#cw-activity .cw-stat{padding:11px 6px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
#cw-activity .cw-stat b{display:block;font-size:26px;color:#fff!important}
#cw-activity .cw-stat span{font-size:12px;color:#cfe4ff!important}
#cw-activity .cw-end .cw-text{margin-left:auto;margin-right:auto}
#cw-activity .cw-endbtns{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px}
#cw-activity .cw-review{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;text-align:left}
#cw-activity .cw-rev{padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
#cw-activity .cw-rev b{display:block;font-size:14px;letter-spacing:.04em;color:#ffe58a!important}
#cw-activity .cw-rev span{font-size:12.5px;line-height:1.35;color:#e6f1ff!important}
#cw-activity .cw-confetti{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none;z-index:6}
#cw-activity .cw-confetti span{position:absolute;top:0;width:10px;height:16px;border-radius:2px;opacity:0;animation:cwFall 3s ease-in forwards}

/* Pie */
#cw-activity .cw-footnote{padding:11px 16px 15px;text-align:center;font-size:12px;color:#cfe4ff!important;border-top:1px solid rgba(255,255,255,.28);background:rgba(4,22,64,.5)}
#cw-activity .cw-footnote a{color:#ffd23f!important;font-weight:800;text-decoration:underline}

/* Adaptación al ancho real del contenedor (data-size lo calcula el script) */
#cw-activity[data-size="m"] .cw-main{padding:16px}
#cw-activity[data-size="m"] .cw-header{padding:12px 16px;gap:12px}
#cw-activity[data-size="m"] .cw-logo{width:46px;height:46px}
#cw-activity[data-size="m"] .cw-title{font-size:22px}
#cw-activity[data-size="m"] .cw-hero{grid-template-columns:minmax(230px,.9fr) minmax(0,1.3fr);gap:18px}
#cw-activity[data-size="m"] .cw-h2{font-size:28px}
#cw-activity[data-size="m"] .cw-layout{gap:12px}
#cw-activity[data-size="m"] .cw-mascot,#cw-activity[data-size="m"] .cw-mascot svg{width:70px}
#cw-activity[data-size="m"] .cw-mascot svg{height:78px}

#cw-activity[data-size="s"] .cw-main,#cw-activity[data-size="xs"] .cw-main{padding:12px}
#cw-activity[data-size="s"] .cw-header,#cw-activity[data-size="xs"] .cw-header{padding:10px 12px;gap:10px}
#cw-activity[data-size="s"] .cw-logo,#cw-activity[data-size="xs"] .cw-logo{width:40px;height:40px}
#cw-activity[data-size="s"] .cw-title{font-size:20px}
#cw-activity[data-size="s"] .cw-block,#cw-activity[data-size="xs"] .cw-block{display:none}
#cw-activity[data-size="s"] .cw-hero,#cw-activity[data-size="xs"] .cw-hero{grid-template-columns:1fr;gap:14px;min-height:0}
#cw-activity[data-size="s"] .cw-h2,#cw-activity[data-size="xs"] .cw-h2{font-size:25px}
#cw-activity[data-size="s"] .cw-layout,#cw-activity[data-size="xs"] .cw-layout{grid-template-columns:1fr;gap:12px}
#cw-activity[data-size="s"] .cw-cluecard,#cw-activity[data-size="xs"] .cw-cluecard{max-height:340px}
#cw-activity[data-size="s"] .cw-stats,#cw-activity[data-size="xs"] .cw-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
#cw-activity[data-size="s"] .cw-mascot,#cw-activity[data-size="s"] .cw-mascot svg,#cw-activity[data-size="xs"] .cw-mascot,#cw-activity[data-size="xs"] .cw-mascot svg{width:60px}
#cw-activity[data-size="s"] .cw-mascot svg,#cw-activity[data-size="xs"] .cw-mascot svg{height:66px}

#cw-activity[data-size="xs"] .cw-title{font-size:16px}
#cw-activity[data-size="xs"] .cw-subtitle{font-size:10px}
#cw-activity[data-size="xs"] .cw-aclue{font-size:15px}
#cw-activity[data-size="xs"] .cw-coach{flex-direction:column;align-items:stretch}
#cw-activity[data-size="xs"] .cw-bubble:before{display:none}
#cw-activity[data-size="xs"] .cw-review{grid-template-columns:1fr}
#cw-activity[data-size="xs"] .cw-bigscore{font-size:34px}
#cw-activity[data-size="xs"] .cw-rank{font-size:24px}

      for (k = 0; k !== data.length; k++) { b = el('div', 'cw-stat'); b.appendChild(el('b', '', data[k][0])); b.appendChild(el('span', '', data[k][1])); grid.appendChild(b); }
      sec.appendChild(grid);
      sec.appendChild(el('p', 'cw-text', msg));
      var btns = el('div', 'cw-endbtns');
      var again = el('button', 'cw-primary', 'Jugar de nuevo \u21BB'); again.type = 'button'; again.addEventListener('click', function () { intro(); });
      var rev = el('button', 'cw-btn', 'Ver repaso de conceptos'); rev.type = 'button';
      btns.appendChild(again); btns.appendChild(rev); sec.appendChild(btns);
      var list = el('div', 'cw-review'), it;
      list.hidden = true;
      for (k = 0; k !== order.length; k++) {
        it = el('div', 'cw-rev'); it.appendChild(el('b', '', W[order[k]].s)); it.appendChild(el('span', '', W[order[k]].ok)); list.appendChild(it);
      }
      rev.addEventListener('click', function () { list.hidden = !list.hidden; rev.textContent = list.hidden ? 'Ver repaso de conceptos' : 'Ocultar repaso'; });
      sec.appendChild(list);
      scr.appendChild(sec);
      confetti(70);
    }

    intro();
  }

  /* ---------- arranque tolerante a eXeLearning ---------- */
  function boot() {
    var roots = document.querySelectorAll('.cw-root'), i;
    for (i = 0; i !== roots.length; i++) {
      try { build(roots[i]); } catch (err) {
        roots[i].appendChild(el('p', 'cw-loading', 'Error al cargar la actividad: ' + err.message));
      }
    }
  }
  boot();
  if (document.addEventListener) {
    document.addEventListener('DOMContentLoaded', boot);
    window.addEventListener('load', boot);
  }
  setTimeout(boot, 400);
  setTimeout(boot, 1500);
})();
</script>

<script>
/* Si esta página va dentro de un iframe, avisa a la página que la contiene de la altura que necesita
   (solo tiene efecto si esa página tiene un receptor; si no, no hace nada). */
(function () {
  if (window.parent === window) { return; }
  var ultimo = -1;
  function enviar() {
    var h = document.body.offsetHeight;
    if (h && h !== ultimo) {
      ultimo = h;
      try { window.parent.postMessage({ tipo: "rd-alto", alto: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("load", enviar);
  window.addEventListener("resize", enviar);
  if (window.ResizeObserver) { new window.ResizeObserver(enviar).observe(document.body); }
  else { window.setInterval(enviar, 500); }
})();
</script>
